name: Share a result
description: Share a measured result from your RouterOS version, hardware or setup.
labels: [result]
body:
  - type: input
    id: routeros
    attributes:
      label: RouterOS version
      placeholder: 7.26beta7
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Hardware or CHR
      placeholder: CRS326-24S+2Q+RM, or CHR in Containerlab
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Lab and setup
      description: Lab folder under tests/, and anything changed from the lab defaults.
      placeholder: tests/medium, mlag-lacp-fallback=no
    validations:
      required: true
  - type: input
    id: tests
    attributes:
      label: Tests run
      placeholder: primary-reboot, secondary-reboot
  - type: textarea
    id: result
    attributes:
      label: Result
      description: Paste or attach the generated report.md of each test. Do not attach packet captures.
    validations:
      required: true

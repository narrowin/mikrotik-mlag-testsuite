# Medium lab, campus option 1: spanning tree off on the MLAG pair, RSTP with edge guards on
# the access switch. Added to medium.yaml.
- {name: "mlag1 protocol-mode none", device: "dc1-core-mlag1", check: "stp_mode", params: {bridge: "bridge"}, expected: "none"}
- {name: "mlag1 bridge forward-reserved-addresses false", device: "dc1-core-mlag1", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "forward-reserved-addresses"}, expected: false}
- {name: "mlag2 protocol-mode none", device: "dc1-core-mlag2", check: "stp_mode", params: {bridge: "bridge"}, expected: "none"}
- {name: "mlag2 bridge forward-reserved-addresses false", device: "dc1-core-mlag2", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "forward-reserved-addresses"}, expected: false}
- {name: "access switch protocol-mode rstp", device: "dc1-access-switch1", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "access switch root 0x0000.02:00:00:21:00:13, is root", device: "dc1-access-switch1", check: "stp_bridge", params: {bridge: "bridge"}, expected: {root_bridge_id: "0x0000.02:00:00:21:00:13", root_bridge: true}}
- {name: "access switch bridge port uplink forwarding", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "uplink"}, expected: {forwarding: true}}
- {name: "access switch bridge port uplink edge", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "uplink"}, expected: {edge: true}}
- {name: "access switch bridge port ether4 forwarding", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "ether4"}, expected: {forwarding: true}}
- {name: "access switch uplink edge=yes", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "uplink"}, name: "edge"}, expected: "yes"}
- {name: "access switch ether4 edge=yes", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "edge"}, expected: "yes"}
- {name: "access switch ether4 bpdu-guard true", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "bpdu-guard"}, expected: true}
- {name: "access switch ether4 loop-protect=on", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/ethernet", where: {name: "ether4"}, name: "loop-protect"}, expected: "on"}

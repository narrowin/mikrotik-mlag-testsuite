# Two-pair deployment, setup equal: RSTP with pair A as root. Added to two-pair.yaml.
- {name: "mlag1 protocol-mode rstp", device: "dc1-core-mlag1", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "mlag1 bridge priority \"0x8000\"", device: "dc1-core-mlag1", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "priority"}, expected: "0x8000"}
- {name: "mlag1 interpair lacp-strict false", device: "dc1-core-mlag1", check: "property", params: {menu: "/interface/bonding", where: {name: "interpair"}, name: "lacp-strict"}, expected: false}
- {name: "mlag1 root 0x8000.02:00:00:21:00:11, bridge ID 0x8000.02:00:00:21:00:11, is root", device: "dc1-core-mlag1", check: "stp_bridge", params: {bridge: "bridge"}, expected: {bridge_id: "0x8000.02:00:00:21:00:11", root_bridge_id: "0x8000.02:00:00:21:00:11", root_bridge: true}}
- {name: "mlag1 bridge port interpair forwarding", device: "dc1-core-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "interpair"}, expected: {forwarding: true}}
- {name: "mlag1 bridge port client2 forwarding", device: "dc1-core-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "client2"}, expected: {forwarding: true}}
- {name: "mlag2 protocol-mode rstp", device: "dc1-core-mlag2", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "mlag2 bridge priority \"0x8000\"", device: "dc1-core-mlag2", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "priority"}, expected: "0x8000"}
- {name: "mlag2 interpair lacp-strict false", device: "dc1-core-mlag2", check: "property", params: {menu: "/interface/bonding", where: {name: "interpair"}, name: "lacp-strict"}, expected: false}
- {name: "mlag2 root 0x8000.02:00:00:21:00:11, bridge ID 0x8000.02:00:00:21:00:11, is root", device: "dc1-core-mlag2", check: "stp_bridge", params: {bridge: "bridge"}, expected: {bridge_id: "0x8000.02:00:00:21:00:11", root_bridge_id: "0x8000.02:00:00:21:00:11", root_bridge: true}}
- {name: "mlag2 bridge port interpair forwarding", device: "dc1-core-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "interpair"}, expected: {forwarding: true}}
- {name: "mlag2 bridge port client2 forwarding", device: "dc1-core-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "client2"}, expected: {forwarding: true}}
- {name: "access mlag1 protocol-mode rstp", device: "dc1-access-mlag1", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "access mlag1 bridge priority \"0x8000\"", device: "dc1-access-mlag1", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "priority"}, expected: "0x8000"}
- {name: "access mlag1 interpair lacp-strict false", device: "dc1-access-mlag1", check: "property", params: {menu: "/interface/bonding", where: {name: "interpair"}, name: "lacp-strict"}, expected: false}
- {name: "access mlag1 root 0x8000.02:00:00:21:00:11, bridge ID 0x8000.02:00:00:21:00:12, not root", device: "dc1-access-mlag1", check: "stp_bridge", params: {bridge: "bridge"}, expected: {bridge_id: "0x8000.02:00:00:21:00:12", root_bridge_id: "0x8000.02:00:00:21:00:11", root_bridge: false}}
- {name: "access mlag1 bridge port interpair forwarding", device: "dc1-access-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "interpair"}, expected: {forwarding: true}}
- {name: "access mlag1 bridge port client1 forwarding", device: "dc1-access-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "client1"}, expected: {forwarding: true}}
- {name: "access mlag2 protocol-mode rstp", device: "dc1-access-mlag2", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "access mlag2 bridge priority \"0x8000\"", device: "dc1-access-mlag2", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "priority"}, expected: "0x8000"}

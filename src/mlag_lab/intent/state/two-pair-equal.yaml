- {name: "access mlag2 root 0x8000.02:00:00:21:00:11, bridge ID 0x8000.02:00:00:21:00:12, not root", device: "dc1-access-mlag2", check: "stp_bridge", params: {bridge: "bridge"}, expected: {bridge_id: "0x8000.02:00:00:21:00:12", root_bridge_id: "0x8000.02:00:00:21:00:11", root_bridge: false}}
- {name: "access mlag2 bridge port interpair forwarding", device: "dc1-access-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "interpair"}, expected: {forwarding: true}}

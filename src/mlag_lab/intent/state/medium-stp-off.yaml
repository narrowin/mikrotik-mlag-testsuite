# Medium lab with spanning tree off on all three switches: added to medium.yaml.
- {name: "mlag1 protocol-mode none", device: "dc1-core-mlag1", check: "stp_mode", params: {bridge: "bridge"}, expected: "none"}
- {name: "mlag1 bridge forward-reserved-addresses false", device: "dc1-core-mlag1", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "forward-reserved-addresses"}, expected: false}
- {name: "mlag2 protocol-mode none", device: "dc1-core-mlag2", check: "stp_mode", params: {bridge: "bridge"}, expected: "none"}
- {name: "mlag2 bridge forward-reserved-addresses false", device: "dc1-core-mlag2", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "forward-reserved-addresses"}, expected: false}
- {name: "access switch protocol-mode none", device: "dc1-access-switch1", check: "stp_mode", params: {bridge: "bridge"}, expected: "none"}
- {name: "access switch bridge forward-reserved-addresses false", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge", where: {name: "bridge"}, name: "forward-reserved-addresses"}, expected: false}
- {name: "access switch uplink edge=no", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "uplink"}, name: "edge"}, expected: "no"}
- {name: "access switch ether4 edge=yes", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "edge"}, expected: "yes"}
- {name: "access switch ether4 bpdu-guard false", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "bpdu-guard"}, expected: false}
- {name: "access switch ether4 loop-protect=default", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/ethernet", where: {name: "ether4"}, name: "loop-protect"}, expected: "default"}

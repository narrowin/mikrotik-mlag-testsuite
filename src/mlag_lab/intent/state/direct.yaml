# Small lab: MLAG and LACP state required before a fault and after the return.
# Each run adds hosts.yaml and direct-<bridge mode>.yaml. The runner checks the MLAG roles
# against the case.
- {name: "mlag1 MLAG connected", device: "dc1-core-mlag1", check: "mlag", params: {bridge: "bridge"}, expected: {connected: true}}
- {name: "mlag1 client1 members ether3", device: "dc1-core-mlag1", check: "bond_members", params: {bond: "client1"}, expected: ["ether3"]}
- {name: "mlag1 client1 member ether3 in use", device: "dc1-core-mlag1", check: "lacp_member", params: {bond: "client1", member: "ether3"}, expected: {synchronization: true, collecting: true, distributing: true}}
- {name: "mlag1 client2 members ether4", device: "dc1-core-mlag1", check: "bond_members", params: {bond: "client2"}, expected: ["ether4"]}
- {name: "mlag1 client2 member ether4 in use", device: "dc1-core-mlag1", check: "lacp_member", params: {bond: "client2", member: "ether4"}, expected: {synchronization: true, collecting: true, distributing: true}}
- {name: "mlag2 MLAG connected", device: "dc1-core-mlag2", check: "mlag", params: {bridge: "bridge"}, expected: {connected: true}}
- {name: "mlag2 client1 members ether3", device: "dc1-core-mlag2", check: "bond_members", params: {bond: "client1"}, expected: ["ether3"]}
- {name: "mlag2 client1 member ether3 in use", device: "dc1-core-mlag2", check: "lacp_member", params: {bond: "client1", member: "ether3"}, expected: {synchronization: true, collecting: true, distributing: true}}
- {name: "mlag2 client2 members ether4", device: "dc1-core-mlag2", check: "bond_members", params: {bond: "client2"}, expected: ["ether4"]}
- {name: "mlag2 client2 member ether4 in use", device: "dc1-core-mlag2", check: "lacp_member", params: {bond: "client2", member: "ether4"}, expected: {synchronization: true, collecting: true, distributing: true}}

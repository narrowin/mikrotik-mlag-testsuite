# Medium lab, RSTP with the access switch as root: added to medium.yaml.
- {name: "mlag1 protocol-mode rstp", device: "dc1-core-mlag1", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "mlag1 root 0x0000.02:00:00:21:00:13", device: "dc1-core-mlag1", check: "stp_bridge", params: {bridge: "bridge"}, expected: {root_bridge_id: "0x0000.02:00:00:21:00:13"}}
- {name: "mlag1 bridge port access-uplink forwarding", device: "dc1-core-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "access-uplink"}, expected: {forwarding: true}}
- {name: "mlag1 bridge port access-uplink non-edge", device: "dc1-core-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "access-uplink"}, expected: {edge: false}}
- {name: "mlag1 bridge port client2 forwarding", device: "dc1-core-mlag1", check: "bridge_port", params: {bridge: "bridge", port: "client2"}, expected: {forwarding: true}}
- {name: "mlag2 protocol-mode rstp", device: "dc1-core-mlag2", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "mlag2 root 0x0000.02:00:00:21:00:13", device: "dc1-core-mlag2", check: "stp_bridge", params: {bridge: "bridge"}, expected: {root_bridge_id: "0x0000.02:00:00:21:00:13"}}
- {name: "mlag2 bridge port access-uplink forwarding", device: "dc1-core-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "access-uplink"}, expected: {forwarding: true}}
- {name: "mlag2 bridge port access-uplink non-edge", device: "dc1-core-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "access-uplink"}, expected: {edge: false}}
- {name: "mlag2 bridge port client2 forwarding", device: "dc1-core-mlag2", check: "bridge_port", params: {bridge: "bridge", port: "client2"}, expected: {forwarding: true}}
- {name: "access switch protocol-mode rstp", device: "dc1-access-switch1", check: "stp_mode", params: {bridge: "bridge"}, expected: "rstp"}
- {name: "access switch root 0x0000.02:00:00:21:00:13, is root", device: "dc1-access-switch1", check: "stp_bridge", params: {bridge: "bridge"}, expected: {root_bridge_id: "0x0000.02:00:00:21:00:13", root_bridge: true}}
- {name: "access switch bridge port uplink forwarding", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "uplink"}, expected: {forwarding: true}}
- {name: "access switch bridge port uplink non-edge", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "uplink"}, expected: {edge: false}}
- {name: "access switch bridge port ether4 forwarding", device: "dc1-access-switch1", check: "bridge_port", params: {bridge: "bridge", port: "ether4"}, expected: {forwarding: true}}
- {name: "access switch uplink edge=no", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "uplink"}, name: "edge"}, expected: "no"}
- {name: "access switch ether4 edge=yes", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "edge"}, expected: "yes"}
- {name: "access switch ether4 bpdu-guard false", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/bridge/port", where: {interface: "ether4"}, name: "bpdu-guard"}, expected: false}
- {name: "access switch ether4 loop-protect=default", device: "dc1-access-switch1", check: "property", params: {menu: "/interface/ethernet", where: {name: "ether4"}, name: "loop-protect"}, expected: "default"}

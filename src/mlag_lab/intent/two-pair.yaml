      at most 5 s.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Pair A secondary back
    expected: CHR 2 rejoins as MLAG secondary under pair A's unchanged ID. CHR 1, CHR 3 and CHR 4 must keep

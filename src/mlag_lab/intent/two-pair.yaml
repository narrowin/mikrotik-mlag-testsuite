two-pair-equal-interpair-member-flap:
  lab: Medium
  title: Inter-pair bond member flap · two MLAG pairs, equal bridge priority 0x8000
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=rstp and bridge priority
    0x8000 on all four CHRs, as in the field report where every MLAG pair kept the same priority. Pair A (CHR
    1 MLAG primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined
    by one distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2
    to pair A, so both VLAN 110 streams cross both pairs. It requires a loss-free baseline with root 0x8000.02:00:00:21:00:11
    on all four CHRs. It then takes the inter-pair bond member between CHR 1 ether3 and CHR 3 ether3 down at
    both ends (both container veths and both QEMU NICs), holds it down for 8 s, brings both ends back up and
    watches 8 s of return plus a 3 s recovery window. The bridge host table size and the topology-change counter
    of every CHR are sampled throughout.
  selectors: [two-pair-equal-interpair-member-flap]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Inter-pair member down
    expected: CHR 1 and CHR 3 each lose their only member of the inter-pair MLAG bond (mlag-id 11 on pair A,
      21 on pair B). The bond keeps forwarding over its other member between CHR 2 and CHR 4, and traffic that
      reaches CHR 1 or CHR 3 crosses its pair's peer port. Streams 101 and 201 lose at most 3 s. The inter-pair
      bond stays one bridge port on each pair, so all four CHRs keep root 0x8000.02:00:00:21:00:11. The field
      report saw unrelated MACs move to the peer port and the host table shrink after this flap; the host table
      size and topology-change counter of every CHR are recorded for comparison.
    limit_s: 3.0
    source: https://forum.mikrotik.com/t/7-25-1-stable-is-released/274226/22
  - key: restoration
    name: Inter-pair member back
    expected: Carrier returns at both ends and LACP adds ether3 back to the inter-pair bond on CHR 1 and CHR
      3 once it shows synchronization, collecting and distributing (S, C, D). Streams 101 and 201 lose at most
      3 s. The inter-pair bond stays one bridge port on each pair, so all four CHRs keep root 0x8000.02:00:00:21:00:11.
    limit_s: 3.0
    source: https://manual.mikrotik.com/docs/cli-reference/interface/bonding/monitor-slaves/


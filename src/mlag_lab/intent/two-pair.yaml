# Two-pair cases, including the field and equal-priority setups.

two-pair-stp-off-baseline:
  lab: Medium
  title: Baseline · two MLAG pairs, spanning tree off
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=none. Pair A (CHR
    1 MLAG primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined
    by one distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2
    to pair A, so both VLAN 110 streams cross both pairs. Then runs numbered 100 ms pings for 4 s in both VLAN
    110 and both bypass directions and reads back bridge, MLAG and LACP state on all four CHRs. No fault is
    applied.
  selectors: [two-pair-stp-off-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: Both pairs are connected, with CHR 1 and CHR 3 as MLAG primaries. With protocol-mode=none no
      bridge sends or forwards BPDUs. Every member of the inter-pair bond and both host bonds is synchronized,
      collecting and distributing, and all four streams deliver with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

two-pair-stp-off-calibrate:
  lab: Medium
  title: One-way calibration · two MLAG pairs, spanning tree off
  action: After the bridge reset (protocol-mode=none) and baseline gate, the runner adds a tc ingress filter
    on host 2's eth3 that drops bypass-forward echo requests (stream 301) for 2 s. It then removes the filter
    and observes 3 s of settling and a 3 s recovery window.
  selectors: [two-pair-stp-off-calibrate]
  graded_flows: [301]
  control_flows: [101, 201, 303]
  phases:
  - key: calibration
    name: One-way bypass cut
    expected: The filter drops only stream 301's echo requests at host 2's bypass port, outside both MLAG pairs.
      Stream 301 shows exactly one gap, with every request sent, and the gap's bounds enclose the measured
      1.9–2.3 s filter interval. The reverse bypass and both VLAN 110 directions lose nothing.
    limit_s: null
    source: lab target

two-pair-stp-off-reboot-a-primary:
  lab: Medium
  title: Pair A primary reboot · two MLAG pairs, spanning tree off
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=none. Pair A (CHR
    1 MLAG primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined
    by one distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2
    to pair A, so both VLAN 110 streams cross both pairs. It requires a loss-free baseline and zero BPDUs.
    It then reboots CHR 1 (pair A's MLAG primary) with `/system reboot`, waits for the guest uptime to reset
    and keeps probing for 16 s plus a 3 s recovery window.
  selectors: [two-pair-stp-off-reboot-a-primary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Pair A primary down
    expected: The surviving peer reverts its MLAG bonds to its own LACP system ID, so the other pair and the
      host renegotiate LACP, with brief loss. The virtual links keep carrier, so partners drop the member to
      the rebooted switch at the LACP short timeout (3 × 1 s). No port depends on spanning tree, no BPDUs appear,
      and each VLAN direction loses at most 5 s.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Pair A primary back
    expected: The rebooted switch keeps its bond members out of the bond until the MLAG system ID syncs (mlag-init-delay)
      and rejoins under the shared system ID. Partners renegotiate LACP with brief loss, and each VLAN direction
      loses at most 5 s.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/


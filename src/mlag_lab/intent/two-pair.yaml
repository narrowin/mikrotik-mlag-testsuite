two-pair-field-baseline:
  lab: Medium
  title: Baseline · two MLAG pairs, field priorities, pair A 0x2000, pair B 0x4000
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=rstp and bridge priority
    0x2000 on pair A and 0x4000 on pair B, the field design with one priority per pair. Pair A (CHR 1 MLAG
    primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined by one
    distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2 to pair
    A, so both VLAN 110 streams cross both pairs. Then runs numbered 100 ms pings for 4 s in both VLAN 110
    and both bypass directions and reads back bridge, MLAG, RSTP and LACP state on all four CHRs. No fault
    is applied.
  selectors: [two-pair-field-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: 'Both pairs are connected and each presents its MLAG primary''s bridge ID: pair A 0x2000.02:00:00:21:00:11,
      pair B 0x4000.02:00:00:21:00:12. All four CHRs report root 0x2000.02:00:00:21:00:11; pair A wins on priority
      0x2000 against 0x4000. Every member of the inter-pair bond and both host bonds is synchronized, collecting
      and distributing, RSTP BPDUs from the root reach pair B, and all four streams deliver with zero loss.'
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

two-pair-field-calibrate:
  lab: Medium
  title: One-way calibration · two MLAG pairs, field priorities, pair A 0x2000, pair B 0x4000
  action: After the bridge reset (bridge priority 0x2000 on pair A and 0x4000 on pair B, the field design with
    one priority per pair) and baseline gate, the runner adds a tc ingress filter on host 2's eth3 that drops
    bypass-forward echo requests (stream 301) for 2 s. It then removes the filter and observes 3 s of settling
    and a 3 s recovery window.
  selectors: [two-pair-field-calibrate]
  graded_flows: [301]
  control_flows: [101, 201, 303]
  phases:
  - key: calibration
    name: One-way bypass cut
    expected: The filter drops only stream 301's echo requests at host 2's bypass port, outside both MLAG pairs.
      Stream 301 shows exactly one gap, with every request sent, and the gap's bounds enclose the measured
      1.9–2.3 s filter interval. The reverse bypass and both VLAN 110 directions lose nothing.
    limit_s: null
    source: lab target


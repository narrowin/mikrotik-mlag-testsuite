two-pair-equal-baseline:
  lab: Medium
  title: Baseline · two MLAG pairs, equal bridge priority 0x8000
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=rstp and bridge priority
    0x8000 on all four CHRs, as in the field report where every MLAG pair kept the same priority. Pair A (CHR
    1 MLAG primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined
    by one distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2
    to pair A, so both VLAN 110 streams cross both pairs. Then runs numbered 100 ms pings for 4 s in both VLAN
    110 and both bypass directions and reads back bridge, MLAG, RSTP and LACP state on all four CHRs. No fault
    is applied.
  selectors: [two-pair-equal-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: 'Both pairs are connected and each presents its MLAG primary''s bridge ID: pair A 0x8000.02:00:00:21:00:11,
      pair B 0x8000.02:00:00:21:00:12. All four CHRs report root 0x8000.02:00:00:21:00:11; pair A wins on the
      lower bridge MAC, because all priorities are equal. Every member of the inter-pair bond and both host
      bonds is synchronized, collecting and distributing, RSTP BPDUs from the root reach pair B, and all four
      streams deliver with zero loss.'
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/


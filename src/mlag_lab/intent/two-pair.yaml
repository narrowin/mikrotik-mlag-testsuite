  lab: Medium
  title: One-way calibration · two MLAG pairs, equal bridge priority 0x8000
  action: After the bridge reset (bridge priority 0x8000 on all four CHRs, as in the field report where every
    MLAG pair kept the same priority) and baseline gate, the runner adds a tc ingress filter on host 2's eth3
    that drops bypass-forward echo requests (stream 301) for 2 s. It then removes the filter and observes 3

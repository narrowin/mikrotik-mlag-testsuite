two-pair-equal-reboot-a-primary:
  lab: Medium
  title: Pair A primary reboot · two MLAG pairs, equal bridge priority 0x8000
  action: Resets the data bridge on all four CHRs over management SSH with protocol-mode=rstp and bridge priority
    0x8000 on all four CHRs, as in the field report where every MLAG pair kept the same priority. Pair A (CHR
    1 MLAG primary, CHR 2 MLAG secondary) and pair B (CHR 3 MLAG primary, CHR 4 MLAG secondary) are joined
    by one distributed LACP bond, mlag-id 11 on pair A and 21 on pair B. Host 1 bonds to pair B and host 2
    to pair A, so both VLAN 110 streams cross both pairs. It requires a loss-free baseline with root 0x8000.02:00:00:21:00:11
    on all four CHRs. It then reboots CHR 1 (pair A's MLAG primary) with `/system reboot`, waits for the guest
    uptime to reset and keeps probing for 16 s plus a 3 s recovery window.
  selectors: [two-pair-equal-reboot-a-primary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Pair A primary down
    expected: If CHR 2 presents its own bridge ID 0x8000.02:00:00:21:00:14 while CHR 1 is away, pair B's 0x8000.02:00:00:21:00:12
      is lower and RSTP moves the root to pair B. That root move, and the topology change it causes on every
      switch, is the field failure this setup reproduces. The case passes only if CHR 2, CHR 3 and CHR 4 keep
      root 0x8000.02:00:00:21:00:11 while the switch is away and each VLAN direction loses at most 5 s.
    limit_s: 5.0
    source: https://forum.mikrotik.com/t/mlag-between-crs326-24s-2q-rm-with-more-than-1-000-hosts-macs/269294
  - key: restoration
    name: Pair A primary back
    expected: CHR 1 rejoins as MLAG primary and pair A presents 0x8000.02:00:00:21:00:11 again. CHR 2, CHR
      3 and CHR 4 must keep root 0x8000.02:00:00:21:00:11 throughout, and each VLAN direction loses at most
      5 s.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/


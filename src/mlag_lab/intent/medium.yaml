external-root-loss:
  lab: Medium
  title: Preferred STP root attachment loss and return · RSTP, r2 on CHR 2 (archived five-CHR)
  action: Archived five-CHR run, replay only. With both MLAG peers up, the runner took the preferred root r2's
    attachment to CHR 2 ether5 down at both ends (r2's Linux eth1 plus the QEMU NIC link on both guests) and
    held it down for 35 s. It then brought the attachment up and observed 16 s plus a 3 s recovery window.
  selectors: [external-root-loss]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Root attachment down
    expected: CHR 2 loses carrier on ether5 and, with it, its root port. RSTP elects the backup root r1, next-lowest
      priority (0x1000.02:00:00:21:00:14), on r1, both MLAG peers and the access switch, while both MLAG peers
      stay up. VLAN 110 traffic between the hosts does not cross r1 or r2, so it sees at most brief loss.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/user-guides/spanning-tree-protocol/#stp-example
  - key: restoration
    name: Root attachment back
    expected: Carrier returns on r2 ether2 and CHR 2 ether5. r2's superior BPDUs (priority 0x0000) make every
      bridge re-elect r2 as root, and RSTP returns the point-to-point non-edge ports to forwarding within seconds.
      By the end of the recovery window every baseline port, including r2 ether2, forwards again.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/user-guides/spanning-tree-protocol/#stp-and-rstp

external-combined-loss:
  lab: Medium
  title: MLAG primary reboot with preferred root attachment loss · RSTP, r1 on CHR 1 (archived five-CHR)
  action: Archived five-CHR run, replay only. The runner took the preferred root r1's attachment to CHR 1 ether5
    down at both ends, then rebooted CHR 1 (MLAG primary) with /system reboot. When CHR 1's uptime reset was
    first observed it brought the attachment back up, then observed 16 s plus a 3 s recovery window.
  selectors: [external-combined-loss]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Primary and root attachment down
    expected: The MLAG secondary CHR 2 loses ICCP and, with mlag-lacp-fallback=yes, reverts its MLAG bonds
      to its own LACP system ID. The access switch and host 2 renegotiate LACP with brief loss. RSTP elects
      the backup root r2 (0x1000.02:00:00:21:00:15), attached to CHR 2 ether5, on CHR 2, r2 and the access
      switch.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/#mlag-settings-and-monitoring
  - key: restoration
    name: Primary and root attachment back
    expected: CHR 1's dual-connected bond members stay out of the MLAG bonds until the MLAG system ID syncs
      (mlag-init-delay=1m). CHR 1 then rejoins as MLAG primary, the shared system ID is restored and the LACP
      partners renegotiate with brief loss. r1's superior BPDUs return on CHR 1 ether5 and every bridge re-elects
      r1 as root.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/#mlag-settings-and-monitoring

medium-stp-off-reboot-secondary:
  lab: Medium
  title: MLAG secondary reboot · Medium lab, all bridges STP off
  action: Resets all three bridges over management SSH with protocol-mode=none. It requires a loss-free probe
    baseline, zero BPDUs and one copy of each broadcast. It then reboots CHR 2 (MLAG secondary, mlag-priority=20)
    with `/system reboot`, waits for the guest uptime to reset and keeps probing for 16 s plus a 3 s recovery
    window.
  selectors: [medium-stp-off-reboot-secondary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Secondary down
    expected: CHR 1 (MLAG primary) keeps the shared system ID, so the access switch's uplink bond and traffic
      host 2 keep their LACP partner and forward over their members to CHR 1. The virtual links keep carrier,
      so each partner drops its member to CHR 2 only at the LACP short timeout (3 × 1 s). With protocol-mode=none
      no port changes state and no BPDUs appear.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Secondary back
    expected: CHR 2 keeps its bond members out of the 802.3ad bond until the MLAG system ID syncs with CHR
      1 (mlag-init-delay), then adds them under the unchanged shared system ID. The access switch and traffic
      host 2 re-add the member to the same aggregator, so loss is brief or none.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

medium-pair-root-reboot-secondary:
  lab: Medium
  title: MLAG secondary reboot · Medium lab, RSTP, MLAG pair as root
  action: Resets all three bridges over management SSH with protocol-mode=rstp, priority 0x1000 on CHR 1 and
    CHR 2 and 0x8000 on the access switch. It requires a loss-free baseline with root ID 0x1000.02:00:00:21:00:11
    in the access switch's BPDUs. It then reboots CHR 2 (MLAG secondary) with `/system reboot`, waits for the
    guest uptime to reset and keeps probing for 16 s plus a 3 s recovery window.
  selectors: [medium-pair-root-reboot-secondary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Secondary down
    expected: CHR 1 keeps the shared system ID, which is both the RSTP bridge ID and the LACP system ID, so
      the access switch still sees root 0x1000.02:00:00:21:00:11 and its uplink stays the forwarding root port.
      The virtual links keep carrier, so the access switch and traffic host 2 drop their member to CHR 2 at
      the LACP short timeout (3 × 1 s). Only traffic hashed to that member sees brief loss.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Secondary back
    expected: CHR 2 keeps its bond members out of the bond until the MLAG system ID syncs (mlag-init-delay),
      then adds them under the unchanged shared system ID. The root ID and the access switch's forwarding uplink
      do not change, so loss is brief or none.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

medium-access-root-reboot-secondary:
  lab: Medium
  title: MLAG secondary reboot · Medium lab, RSTP, access switch as root
  action: Resets all three bridges over management SSH with protocol-mode=rstp, priority 0x1000 on CHR 1 and
    CHR 2 and 0x0000 on the access switch. It requires a loss-free baseline with the access switch as root
    (0x0000.02:00:00:21:00:13). It then reboots CHR 2 (MLAG secondary) with `/system reboot`, waits for the
    guest uptime to reset and keeps probing for 16 s plus a 3 s recovery window.
  selectors: [medium-access-root-reboot-secondary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Secondary down
    expected: CHR 1 keeps the shared system ID, so the access switch keeps its LACP partner and stays RSTP
      root. The MLAG pair keeps access-uplink as its forwarding root port. The virtual links keep carrier,
      so the access switch and traffic host 2 drop their member to CHR 2 at the LACP short timeout (3 × 1 s),
      with brief loss on traffic hashed to it.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Secondary back
    expected: CHR 2 keeps its bond members out of the bond until the MLAG system ID syncs (mlag-init-delay),
      then adds them under the unchanged shared system ID. The access switch stays root, and CHR 2's non-edge
      access-uplink must reach forwarding without a further outage.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/


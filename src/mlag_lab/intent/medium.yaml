# Medium cases, including selectors retained for archived captures.

medium-stp-off-baseline:
  lab: Medium
  title: Baseline · all bridges STP off
  action: Reset the data bridge on all three CHRs over management SSH with protocol-mode=none (priority 0x1000
    on both MLAG peers, 0x8000 on the access switch). Then run numbered 100 ms pings for 4 s in both VLAN 110
    directions and both bypass directions, read back bridge, MLAG and LACP state, and send three ARP broadcasts
    each way. No fault is applied.
  selectors: [medium-stp-off-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: Both MLAG peers show mlag-state connected once ICCP is established, with CHR 1 as MLAG primary
      (lower mlag-priority) and CHR 2 as MLAG secondary. Every bond member of the MLAG bonds and of the access
      switch uplink is synchronized, collecting and distributing. With protocol-mode=none no bridge sends or
      forwards BPDUs, each ARP broadcast arrives exactly once, and all four streams deliver with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/#mlag-settings-and-monitoring

medium-pair-root-baseline:
  lab: Medium
  title: Baseline · RSTP, MLAG pair as root
  action: Reset the data bridge on all three CHRs over management SSH with protocol-mode=rstp, priority 0x1000
    on both MLAG peers and 0x8000 on the access switch. Then run numbered 100 ms pings for 4 s in both VLAN
    110 and both bypass directions and read back bridge, MLAG, RSTP and LACP state. No fault is applied.
  selectors: [medium-pair-root-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: Both MLAG peers are connected and use the MLAG primary's system ID as the shared RSTP bridge
      ID, so both show as root bridge with root ID 0x1000.02:00:00:21:00:11. The access switch picks its non-edge
      uplink bond as root port and all VLAN 110 ports forward. RSTP BPDUs from that root reach the access switch,
      and all four streams deliver with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

medium-access-root-baseline:
  lab: Medium
  title: Baseline · RSTP, access switch as root
  action: Reset the data bridge on all three CHRs over management SSH with protocol-mode=rstp, priority 0x1000
    on both MLAG peers and 0x0000 on the access switch. Then run numbered 100 ms pings for 4 s in both VLAN
    110 and both bypass directions and read back bridge, MLAG, RSTP and LACP state. No fault is applied.
  selectors: [medium-access-root-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: The access switch has the lowest bridge priority (0x0000), so every bridge elects it as RSTP
      root with root ID 0x0000.02:00:00:21:00:13. The connected MLAG peers present one shared bridge ID toward
      it. The non-edge MLAG bond access-uplink and all VLAN 110 ports forward, and all four streams deliver
      with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/user-guides/spanning-tree-protocol/#election-process

external-baseline:
  lab: Medium
  title: Baseline · RSTP, external root r2 (archived five-CHR)
  action: Archived five-CHR run, replay only. The runner reset all five bridges over management SSH with protocol-mode=rstp,
    priority 0x0000 on r2 and 0x1000 on r1, then ran the 4 s numbered-ping window in both VLAN 110 and both
    bypass directions and read back bridge, MLAG, RSTP and LACP state. No fault is applied.
  selectors: [external-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: Every bridge elects the preferred external root r2, which has the lowest priority (root ID 0x0000.02:00:00:21:00:15).
      r1 runs as backup with bridge ID 0x1000.02:00:00:21:00:14. CHR 2 uses ether5 as root port, CHR 1 uses
      the peer port ether2 and the access switch uses its uplink bond. MLAG is connected, all VLAN 110 ports
      forward and all four streams deliver with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/user-guides/spanning-tree-protocol/#election-process

external-no-stp-baseline:
  lab: Medium
  title: Baseline · STP off on MLAG peers only (archived five-CHR)
  action: Archived five-CHR run, replay only. The runner reset all five bridges over management SSH with protocol-mode=none
    on both MLAG peers and rstp on the access switch, r1 and r2 (r2 0x0000, r1 0x1000). It then ran the 4 s
    numbered-ping window, read back state and sent three ARP broadcasts each way. No fault is applied.
  selectors: [external-no-stp-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: With protocol-mode=none and forward-reserved-addresses=no, the MLAG peers neither send BPDUs
      nor pass the BPDUs of r1, r2 or the access switch, while r1 and r2 keep sending their own. MLAG is connected
      and all LACP bond members are synchronized, collecting and distributing. Each ARP broadcast arrives once
      and all four streams deliver with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/#bridge-interface-setup

external-all-stp-off-baseline:
  lab: Medium
  title: Baseline · all bridges STP off (archived five-CHR)
  action: Archived five-CHR run, replay only. The runner reset all five bridges over management SSH with protocol-mode=none,
    then ran the 4 s numbered-ping window in both VLAN 110 and both bypass directions, read back state and
    sent three ARP broadcasts each way. No fault is applied.
  selectors: [external-all-stp-off-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: With protocol-mode=none on all five bridges, no BPDU appears on any captured port. MLAG is connected
      and the bond members of both MLAG bonds are synchronized, collecting and distributing. Each ARP broadcast
      arrives exactly once, so the dual-attached access switch bond forms no loop, and all four streams deliver
      with zero loss.
    limit_s: 0.0
    source: https://manual.mikrotik.com/docs/bridging-and-switching/#bridge-interface-setup

root-calibrate:
  lab: Medium
  title: One-way calibration · RSTP, MLAG pair as root (pair-root deployment)
  action: On the dedicated pair-root deployment, which keeps its startup RSTP config with no bridge reset,
    the runner verifies the baseline. It then adds a tc ingress filter on host 2's eth3 that drops bypass-forward
    echo requests (stream 301) for 2 s, removes it, and observes 3 s of settling and a 3 s recovery window.
  selectors: [root-calibrate]
  graded_flows: [301]
  control_flows: [101, 201, 303]
  phases:
  - key: calibration
    name: One-way bypass cut
    expected: The filter drops only stream 301's echo requests at host 2's bypass port, outside the MLAG fabric.
      Stream 301 shows exactly one gap, with every request sent, and the gap's bounds enclose the measured
      1.9–2.3 s filter interval. The reverse bypass and both VLAN 110 directions lose nothing.
    limit_s: null
    source: lab target


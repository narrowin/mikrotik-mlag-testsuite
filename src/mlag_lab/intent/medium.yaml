medium-stp-off-power-loss-secondary:
  lab: Medium
  title: MLAG secondary power loss · Medium lab, all bridges STP off
  action: 'Resets all three bridges over management SSH with protocol-mode=none. It requires a loss-free probe
    baseline, zero BPDUs and one copy of each broadcast. It then emulates a power loss of CHR 2 (MLAG secondary,
    mlag-priority=20): in one step it takes the container veths behind CHR 2''s ether2 to ether4 down, sets
    the facing NICs of CHR 1 and the access switch link-down over QMP and pauses CHR 2''s guest with QMP stop,
    then confirms carrier loss at every neighbour. After 20 s it powers CHR 2 on with QMP system_reset and
    cont, brings the links back up, waits for the guest uptime to reset and keeps probing for 16 s plus a 3
    s recovery window.'
  selectors: [medium-stp-off-power-loss-secondary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Secondary off
    expected: Every link to CHR 2 loses carrier at once, as on a real power loss. CHR 1 (MLAG primary) sees
      its peer port ether2 go down and keeps the shared system ID, so the access switch's uplink bond and traffic
      host 2 keep their LACP partner. They drop their member to CHR 2 on carrier loss, without waiting for
      the LACP short timeout, and forward over their members to CHR 1. With protocol-mode=none no port changes
      state and no BPDUs appear.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Secondary back
    expected: Carrier returns while CHR 2 boots. CHR 2 keeps its bond members out of the 802.3ad bond until
      the MLAG system ID syncs with CHR 1 (mlag-init-delay), then adds them under the unchanged shared system
      ID. The access switch and traffic host 2 re-add the member to the same aggregator, so loss is brief or
      none.

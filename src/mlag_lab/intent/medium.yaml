medium-core-off-baseline:
  lab: Medium
  title: Baseline · STP off on the MLAG pair, RSTP on the access switch (campus option 1)
  action: 'Resets the data bridge on all three CHRs over management SSH: protocol-mode=none and forward-reserved-addresses=no
    on both MLAG peers, protocol-mode=rstp priority=0x0000 on the access switch, with edge=yes on its uplink
    bond and edge=yes, bpdu-guard=yes and loop-protect=on on its host port ether4, and reads the access switch

  - key: withdrawal
    name: Secondary off
    expected: Every link to CHR 2 loses carrier at once, as on a real power loss. CHR 1 (MLAG primary) sees
      its peer port ether2 go down and keeps the shared system ID, so the access switch's uplink bond and traffic
      host 2 keep their LACP partner. They drop their member to CHR 2 on carrier loss, without waiting for
      the LACP short timeout. The uplink bond keeps one running member, so the access switch's edge bridge
      port keeps forwarding.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Secondary back
    expected: Carrier returns while CHR 2 boots. CHR 2 keeps its bond members out of the 802.3ad bond until
      the MLAG system ID syncs with CHR 1 (mlag-init-delay), then adds them under the unchanged shared system
      ID. The access switch re-adds the member to its forwarding edge uplink, so loss is brief or none.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

medium-core-off-power-loss-primary:
  lab: Medium
  title: MLAG primary power loss · Medium lab, STP off on the MLAG pair, RSTP on the access switch (campus
    option 1)
  action: 'Resets the data bridge on all three CHRs over management SSH: protocol-mode=none and forward-reserved-addresses=no
    on both MLAG peers, protocol-mode=rstp priority=0x0000 on the access switch, with edge=yes on its uplink
    bond and edge=yes, bpdu-guard=yes and loop-protect=on on its host port ether4, and reads the access switch
    port settings back. It requires a loss-free probe baseline, no BPDU from or through the MLAG pair and one
    copy of each broadcast. It then emulates a power loss of CHR 1 (MLAG primary): in one step it takes the
    container veths behind CHR 1''s ether2 to ether4 down, sets the facing NICs of CHR 2 and the access switch
    link-down over QMP and pauses CHR 1''s guest with QMP stop, then confirms carrier loss at every neighbour.
    After 20 s it powers CHR 1 on with QMP system_reset and cont, brings the links back up, waits for the guest
    uptime to reset and keeps probing for 16 s plus a 3 s recovery window.'
  selectors: [medium-core-off-power-loss-primary]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: withdrawal
    name: Primary off
    expected: Every link to CHR 1 loses carrier at once, as on a real power loss. CHR 2 sees its peer port
      ether2 go down and reverts its MLAG bonds to its own LACP system ID, so the access switch and traffic
      host 2 renegotiate LACP, with brief loss. They drop their member to CHR 1 on carrier loss, without waiting
      for the LACP short timeout. The access switch's uplink is an edge port, so it forwards as soon as LACP
      has reselected.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
  - key: restoration
    name: Primary back
    expected: Carrier returns while CHR 1 boots. CHR 1 keeps its bond members out of the bond until the MLAG
      system ID syncs (mlag-init-delay), rejoins as MLAG primary and restores the shared system ID. The access
      switch and traffic host 2 renegotiate LACP to the shared system ID with brief loss, and the edge uplink
      forwards again at once.
    limit_s: 5.0
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/

    read back bridge, MLAG, RSTP and LACP state, and send three ARP broadcasts each way. No fault is applied.'
  selectors: [medium-core-off-baseline]
  graded_flows: [101, 201]
  control_flows: [301, 303]
  phases:
  - key: baseline
    name: Baseline
    expected: Both MLAG peers run protocol-mode=none with forward-reserved-addresses=no, so they neither send
      BPDUs nor pass the access switch's BPDUs (STP group address 01:80:C2:00:00:00). The access switch is
      the only RSTP bridge and, with priority 0x0000, its own root (root ID 0x0000.02:00:00:21:00:13). Its
      uplink bond is an edge port, so it forwards at once without a proposal/agreement handshake, and its host
      port ether4 is an edge port with bpdu-guard=yes and loop-protect=on. MLAG is connected, every bond member
      is synchronized, collecting and distributing, each ARP broadcast arrives once and all four streams deliver
      with zero loss.

# SMALL-06 — Reboot whichever switch currently reports the secondary MLAG role.
fault:
  reboot_role: secondary
  surviving_role: primary
  require_uptime_reset: true
  baseline_seconds: 4
  observe_after_boot_seconds: 16
  recovery_seconds: 3

# Check once before the reboot and again after recovery. In events.jsonl these
# snapshots are baseline_observed / baseline_restored. The native forwarding
# replies are baseline_bridge_port_intent / restored_bridge_port_intent.
expected_state:
  peers:
    - p1  # dc1-core-mlag1
    - p2  # dc1-core-mlag2
  mlag-state: connected
  bridge_forwarding:
    bridge: bridge
    ports: [client1, client2]  # RouterOS bond interface names on each switch
    forwarding: true           # Boolean from /interface/bridge/port/monitor
  router_lacp:
    members: [ether3, ether4]
    actor_and_partner_flags: SCD  # synchronized, collecting, distributing
  client_lacp:
    members:
      c1: [eth1, eth2]  # dc1-traffic-host1, members of bond0
      c2: [eth1, eth2]  # dc1-traffic-host2, members of bond0
    carrier: true
    eligible: true

# Numbers below are ICMP identifiers in the packet captures.
traffic:
  loss_free_baseline: true
  client_streams:
    - 101  # dc1-traffic-host1/bond0 → dc1-traffic-host2/bond0
    - 201  # dc1-traffic-host2/bond0 → dc1-traffic-host1/bond0
  max_client_outage_seconds: {withdrawal: 5, restoration: 5}
  recovery_consecutive_replies: 10
  loss_free_bypass_streams:
    - 301  # dc1-traffic-host1/eth3 → dc1-traffic-host2/eth3
    - 303  # dc1-traffic-host2/eth3 → dc1-traffic-host1/eth3
  no_sender_return_streams:
    - 501  # dc1-traffic-host1/bond0 → 10.110.0.255 (broadcast)
    - 502  # dc1-traffic-host1/bond0 → 10.110.0.99 (unknown unicast)

name: ${MLAG_LAB_NAME:=mlag-large}
mgmt:
  network: ${MLAG_LAB_NAME:=mlag-large}-mgmt
  ipv4-subnet: 172.30.${MLAG_MGMT_NET:=220}.0/27
topology:
  kinds:
    mikrotik_chr:
      image: "${MLAG_CHR_IMAGE:=mikrotik/chr:development}"
      startup-config: large.rsc
      binds:
        - ../shared/qemu-data-link.sh:/usr/local/bin/qemu-system-aarch64:ro
        - ../shared/qemu-data-link.sh:/usr/local/bin/qemu-system-x86_64:ro
        - ../shared/forward-control.sh:/lab/forward-control.sh:ro
      stages:
        create:
          wait-for:
            - node: dc1-syslog-collector
              stage: healthy
  nodes:
    dc1-syslog-collector:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Management network syslog collector"
      kind: linux
      image: "${MLAG_SYSLOG_IMAGE:=rsyslog/rsyslog:latest}"
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.20
      user: "${SUDO_UID:=0}:${SUDO_GID:=0}"
      entrypoint: rsyslogd
      cmd: "-n -iNONE -f /etc/rsyslog.conf"
      binds:
        - ../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - ./logs:/evidence
      healthcheck:
        test:
          - CMD-SHELL
          - "test -w /evidence && { test ! -e /evidence/routeros.jsonl || test -w /evidence/routeros.jsonl; } && grep -q ':05EA ' /proc/net/udp"
        interval: 1
        timeout: 3
        retries: 12
    dc1-core-mlag1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A core MLAG switch 1, preferred MLAG primary"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.11
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc1-core-mlag2:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A core MLAG switch 2"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.12
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc1-access-mlag1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A distribution MLAG switch 1, preferred MLAG primary"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.13
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc1-access-mlag2:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A distribution MLAG switch 2"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.14
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc1-firewall1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A CHR firewall, VRRP priority 150 on VLAN 390"
      kind: mikrotik_chr
      startup-config: large-firewall.rsc
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.15
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 tap1 tap2
    dc1-traffic-host1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A traffic host, VLAN 110 control and VLAN 390 VIP probe, bonded to the distribution pair"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.16
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer2+3
        - ip link set dev bond0 address 02:00:00:42:00:16
        - ip link set dev eth1 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 down
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip address replace 10.110.0.16/24 dev bond0
        - ip link add link bond0 name vlan390 type vlan id 390
        - ip address replace 198.18.40.16/24 dev vlan390
        - ip link set dev vlan390 up
        - ip address replace 198.51.100.1/30 dev eth3
        - ip link set dev eth3 up
        - ip neigh replace 10.110.0.17 lladdr 02:00:00:42:00:17 nud permanent dev bond0
    dc1-service-host1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Site A service host, VLAN 110 control peer, bonded to the distribution pair"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.17
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer2+3
        - ip link set dev bond0 address 02:00:00:42:00:17
        - ip link set dev eth1 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 down
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip address replace 10.110.0.17/24 dev bond0
        - ip neigh replace 10.110.0.16 lladdr 02:00:00:42:00:16 nud permanent dev bond0
    dc2-core-mlag1:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B core MLAG switch 1, preferred MLAG primary"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.21
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc2-core-mlag2:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B core MLAG switch 2"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.22
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc2-access-mlag1:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B distribution MLAG switch 1, preferred MLAG primary"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.23
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc2-access-mlag2:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B distribution MLAG switch 2"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.24
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 eth4 tap1 tap2 tap3 tap4
    dc2-firewall1:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B CHR firewall, VRRP priority 100 on VLAN 390"
      kind: mikrotik_chr
      startup-config: large-firewall.rsc
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.25
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 tap1 tap2
    dc2-traffic-host1:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B traffic host, VLAN 120 control and VLAN 390 VIP probe, bonded to the distribution pair"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.26
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer2+3
        - ip link set dev bond0 address 02:00:00:42:00:26
        - ip link set dev eth1 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 down
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip address replace 10.120.0.26/24 dev bond0
        - ip link add link bond0 name vlan390 type vlan id 390
        - ip address replace 198.18.40.26/24 dev vlan390
        - ip link set dev vlan390 up
        - ip address replace 198.51.100.2/30 dev eth3
        - ip link set dev eth3 up
        - ip neigh replace 10.120.0.27 lladdr 02:00:00:42:00:27 nud permanent dev bond0
    dc2-service-host1:
      labels:
        site: dc2
        lab-vm: mlag-external
        role: "Site B service host, VLAN 120 control peer, bonded to the distribution pair"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=220}.27
      exec:
        - ip link add bond0 type bond mode 802.3ad miimon 100 lacp_rate fast xmit_hash_policy layer2+3
        - ip link set dev bond0 address 02:00:00:42:00:27
        - ip link set dev eth1 down
        - ip link set dev eth1 master bond0
        - ip link set dev eth2 down
        - ip link set dev eth2 master bond0
        - ip link set dev bond0 up
        - ip link set dev eth1 up
        - ip link set dev eth2 up
        - ip address replace 10.120.0.27/24 dev bond0
        - ip neigh replace 10.120.0.26 lladdr 02:00:00:42:00:26 nud permanent dev bond0
  groups:
    probes:
      image: mlag-lab-endpoint:local
  links:
    # Site A
    - endpoints: ["dc1-core-mlag1:eth1", "dc1-core-mlag2:eth1"]
    - endpoints: ["dc1-access-mlag1:eth1", "dc1-access-mlag2:eth1"]
    - endpoints: ["dc1-core-mlag1:eth2", "dc1-access-mlag1:eth2"]
    - endpoints: ["dc1-core-mlag2:eth2", "dc1-access-mlag2:eth2"]
    - endpoints: ["dc1-core-mlag1:eth4", "dc1-firewall1:eth1"]
    - endpoints: ["dc1-core-mlag2:eth4", "dc1-firewall1:eth2"]
    - endpoints: ["dc1-access-mlag1:eth3", "dc1-traffic-host1:eth1"]
    - endpoints: ["dc1-access-mlag2:eth3", "dc1-traffic-host1:eth2"]
    - endpoints: ["dc1-access-mlag1:eth4", "dc1-service-host1:eth1"]
    - endpoints: ["dc1-access-mlag2:eth4", "dc1-service-host1:eth2"]
    # Site B
    - endpoints: ["dc2-core-mlag1:eth1", "dc2-core-mlag2:eth1"]
    - endpoints: ["dc2-access-mlag1:eth1", "dc2-access-mlag2:eth1"]
    - endpoints: ["dc2-core-mlag1:eth2", "dc2-access-mlag1:eth2"]
    - endpoints: ["dc2-core-mlag2:eth2", "dc2-access-mlag2:eth2"]
    - endpoints: ["dc2-core-mlag1:eth4", "dc2-firewall1:eth1"]
    - endpoints: ["dc2-core-mlag2:eth4", "dc2-firewall1:eth2"]
    - endpoints: ["dc2-access-mlag1:eth3", "dc2-traffic-host1:eth1"]
    - endpoints: ["dc2-access-mlag2:eth3", "dc2-traffic-host1:eth2"]
    - endpoints: ["dc2-access-mlag1:eth4", "dc2-service-host1:eth1"]
    - endpoints: ["dc2-access-mlag2:eth4", "dc2-service-host1:eth2"]
    # DCI, two straight members, and the independent bypass
    - endpoints: ["dc1-core-mlag1:eth3", "dc2-core-mlag1:eth3"]
    - endpoints: ["dc1-core-mlag2:eth3", "dc2-core-mlag2:eth3"]
    - endpoints: ["dc1-traffic-host1:eth3", "dc2-traffic-host1:eth3"]

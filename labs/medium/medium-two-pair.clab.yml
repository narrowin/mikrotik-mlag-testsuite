name: ${MLAG_LAB_NAME:=mlag-medium-two-pair}
mgmt:
  network: ${MLAG_LAB_NAME:=mlag-medium-two-pair}-mgmt
  ipv4-subnet: 172.30.${MLAG_MGMT_NET:=219}.0/27
topology:
  kinds:
    mikrotik_chr:
      image: "${MLAG_CHR_IMAGE:=mikrotik/chr:development}"
      startup-config: medium-two-pair.rsc
      binds:
        - ../shared/qemu-data-link.sh:/usr/local/bin/qemu-system-aarch64:ro
        - ../shared/qemu-data-link.sh:/usr/local/bin/qemu-system-x86_64:ro
        - ../shared/forward-control.sh:/lab/forward-control.sh:ro
      stages:
        create:
          wait-for:
            - node: dc1-syslog-collector
              stage: healthy
  nodes:
    dc1-syslog-collector:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Management network syslog collector"
      kind: linux
      image: "${MLAG_SYSLOG_IMAGE:=rsyslog/rsyslog:latest}"
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.20
      user: "${SUDO_UID:=0}:${SUDO_GID:=0}"
      entrypoint: rsyslogd
      cmd: "-n -iNONE -f /etc/rsyslog.conf"
      binds:
        - ../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - ./two-pair-logs:/evidence
      healthcheck:
        test:
          - CMD-SHELL
          - "test -w /evidence && { test ! -e /evidence/routeros.jsonl || test -w /evidence/routeros.jsonl; } && grep -q ':05EA ' /proc/net/udp"
        interval: 1
        timeout: 3
        retries: 12
    dc1-core-mlag1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "MLAG pair A switch 1, intended STP root pair"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.11
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 tap1 tap2 tap3
    dc1-core-mlag2:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "MLAG pair A switch 2, intended STP root pair"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.12
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 tap1 tap2 tap3
    dc1-access-mlag1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "MLAG pair B switch 1"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.13
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 tap1 tap2 tap3
    dc1-access-mlag2:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "MLAG pair B switch 2"
      kind: mikrotik_chr
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.14
      exec:
        - /bin/sh /lab/forward-control.sh --wire eth1 eth2 eth3 tap1 tap2 tap3
    dc1-traffic-host1:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Linux VLAN 110 and bypass probe host 1, bonded to MLAG pair B"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.16
      exec:
        - /bin/sh /lab/client-network.sh 11
        - ip neigh replace 10.110.0.12 lladdr 02:00:00:11:00:12 nud permanent dev bond0
    dc1-traffic-host2:
      labels:
        site: dc1
        lab-vm: mlag-external
        role: "Linux VLAN 110 and bypass probe host 2, bonded to MLAG pair A"
      kind: linux
      group: probes
      mgmt-ipv4: 172.30.${MLAG_MGMT_NET:=219}.17
      exec:
        - /bin/sh /lab/client-network.sh 12
        - ip neigh replace 10.110.0.11 lladdr 02:00:00:11:00:11 nud permanent dev bond0
  groups:
    probes:
      image: mlag-lab-endpoint:local
      binds:
        - ../shared/client-network.sh:/lab/client-network.sh:ro
  links:
    - endpoints: ["dc1-core-mlag1:eth1", "dc1-core-mlag2:eth1"]
    - endpoints: ["dc1-access-mlag1:eth1", "dc1-access-mlag2:eth1"]
    - endpoints: ["dc1-core-mlag1:eth2", "dc1-access-mlag1:eth2"]
    - endpoints: ["dc1-core-mlag2:eth2", "dc1-access-mlag2:eth2"]
    - endpoints: ["dc1-core-mlag1:eth3", "dc1-traffic-host2:eth1"]
    - endpoints: ["dc1-core-mlag2:eth3", "dc1-traffic-host2:eth2"]
    - endpoints: ["dc1-access-mlag1:eth3", "dc1-traffic-host1:eth1"]
    - endpoints: ["dc1-access-mlag2:eth3", "dc1-traffic-host1:eth2"]
    - endpoints: ["dc1-traffic-host1:eth3", "dc1-traffic-host2:eth3"]

general:
  transport: system
  ssh_config_file: false
  ssh_strict_host_key_checking: false
  timeout: 3
  connection_retries: 1
  command_timeout: 5
  results_format: json
devices:
  dc1-core-mlag1:
    host: 172.30.218.11
    device_type: mikrotik_routeros
  dc1-core-mlag2:
    host: 172.30.218.12
    device_type: mikrotik_routeros
  dc1-access-switch1:
    host: 172.30.218.13
    device_type: mikrotik_routeros
  dc1-traffic-host1:
    host: 172.30.218.16
    device_type: linux
  dc1-traffic-host2:
    host: 172.30.218.17
    device_type: linux
groups:
  dc1-routeros:
    description: The three RouterOS CHR guests on the mlag-external OrbStack VM
    members: [dc1-core-mlag1, dc1-core-mlag2, dc1-access-switch1]
  mlag-peers:
    description: The Medium lab MLAG pair
    members: [dc1-core-mlag1, dc1-core-mlag2]
  access-switch:
    description: The Medium lab access switch
    members: [dc1-access-switch1]
  linux-hosts:
    description: The Linux lab nodes, reached over SSH as root with the fixed lab password
    members: [dc1-traffic-host1, dc1-traffic-host2]
    credentials: {user: root, password: admin}

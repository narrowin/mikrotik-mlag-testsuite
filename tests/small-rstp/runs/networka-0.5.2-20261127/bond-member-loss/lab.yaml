streams:
  - name: client1-to-client2
    from: client1:bond0
    to: client2:bond0
  - name: client2-to-client3
    from: client2:bond0
    to: client3:bond0
state:
  - statement: Both switches show MLAG connected.
    checks:
      - device: switch1
        check: mlag
        params: &bridge
          bridge: bridge
        expected: &connected
          connected: true
      - device: switch2
        check: mlag
        params: *bridge
        expected: *connected
  - statement: Both switches run RSTP.
    checks:
      - device: switch1
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch2
        check: stp_mode
        params: *bridge
        expected: rstp
  - statement: Both MLAG peers are the RSTP root bridge.
    checks:
      - device: switch1
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true}
      - device: switch2
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true}
  - statement: Every bridge port of both peers forwards, and the client ports are edge ports.
    checks:
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: client1}
        expected: {forwarding: true, edge: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: client2}
        expected: {forwarding: true, edge: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: client3}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: client1}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: client2}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: client3}
        expected: {forwarding: true, edge: true}
  - statement: Both cables of every client are eligible in its LACP bond.
    checks:
      - device: client1
        check: bond_member
        params: &first-member
          bond: bond0
          member: eth1
        expected: &eligible
          eligible: true
      - device: client1
        check: bond_member
        params: &second-member
          bond: bond0
          member: eth2
        expected: *eligible
      - device: client2
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: client2
        check: bond_member
        params: *second-member
        expected: *eligible
      - device: client3
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: client3
        check: bond_member
        params: *second-member
        expected: *eligible
switch_log: syslog/switches.log

streams:
  - name: host1-to-host2
    from: host1:bond0
    to: host2:bond0
  - name: host2-to-host3
    from: host2:bond0
    to: host3:bond0
state:
  - name: Both switches show MLAG connected.
    checks:
      - device: switch1
        check: mlag
        params: &bridge
          bridge: bridge
        expected: &connected
          connected: true
      - device: switch2
        check: mlag
        params: *bridge
        expected: *connected
  - name: Both switches run RSTP.
    checks:
      - device: switch1
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch2
        check: stp_mode
        params: *bridge
        expected: rstp
  - name: Both MLAG peers are the RSTP root bridge.
    checks:
      - device: switch1
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true}
      - device: switch2
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true}
  - name: Every bridge port of both peers forwards, and the host ports are edge ports.
    checks:
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: host1}
        expected: {forwarding: true, edge: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: host3}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: host1}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: host3}
        expected: {forwarding: true, edge: true}
  - name: Both cables of every host are eligible in its LACP bond.
    checks:
      - device: host1
        check: bond_member
        params: &first-member
          bond: bond0
          member: eth1
        expected: &eligible
          eligible: true
      - device: host1
        check: bond_member
        params: &second-member
          bond: bond0
          member: eth2
        expected: *eligible
      - device: host2
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: host2
        check: bond_member
        params: *second-member
        expected: *eligible
      - device: host3
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: host3
        check: bond_member
        params: *second-member
        expected: *eligible
switch_log: syslog/switches.log

# The switches send their log over UDP to the standard syslog port.
module(load="imudp")
input(type="imudp" port="514")

# One line per message: receive time in UTC with microseconds, switch name, topics and text.
template(name="line" type="list") {
    property(name="timegenerated" dateFormat="rfc3339")
    constant(value=" ")
    property(name="hostname")
    constant(value=" ")
    property(name="syslogtag")
    property(name="msg")
    constant(value="\n")
}

action(type="omfile" file="/logs/switches.log" template="line")

name: two-pair-rstp
mgmt:
  network: two-pair-rstp-mgmt
  # A separate subnet keeps lab management traffic off the host's other Docker networks.
  ipv4-subnet: 172.30.114.0/24
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.26beta7@sha256:b68f34a50544f6464d592cdd07ecc1d08017d6ec6837ac42b7dbe701d3c1ca6a
      startup-config: ../../two-pair/lab/switch.rsc
      # The startup config reads the collector address, the inter-pair lacp-strict value and the spanning tree mode from here.
      env:
        COLLECTOR: 172.30.114.10
        STP_MODE: rstp
        LACP_STRICT: "no"
  groups:
    hosts:
      kind: linux
      image: mlag-host:local
      binds:
        - ../../two-pair/lab/host-setup.sh:/lab/host-setup.sh:ro
      exec:
        - sh /lab/host-setup.sh
      # The deploy returns only when all four switches answer.
      stages:
        create:
          wait-for:
            - node: switch-a1
              stage: healthy
            - node: switch-a2
              stage: healthy
            - node: switch-b1
              stage: healthy
            - node: switch-b2
              stage: healthy
  nodes:
    syslog:
      kind: linux
      image: rsyslog/rsyslog@sha256:cac80b5513d78de76c301151e4d248547bcf2b5161d9c891a4b10c302f76dd56
      # The image's own user cannot write into the lab folder that containerlab creates as root.
      user: "0"
      # All four switches send their log to this fixed collector address.
      mgmt-ipv4: 172.30.114.10
      binds:
        - ../../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - __clabNodeDir__:/logs
    switch-a1:
      kind: mikrotik_chr
    switch-a2:
      kind: mikrotik_chr
    switch-b1:
      kind: mikrotik_chr
    switch-b2:
      kind: mikrotik_chr
    host1:
      group: hosts
    host2:
      group: hosts
  links:
    # A CHR's ethN maps to RouterOS ether(N+1) because ether1 is management.
    # The peer link of pair A and of pair B.
    - endpoints:
        - switch-a1:eth1
        - switch-a2:eth1
    - endpoints:
        - switch-b1:eth1
        - switch-b2:eth1
    # The two members of the inter-pair bond.
    - endpoints:
        - switch-a1:eth2
        - switch-b1:eth2
    - endpoints:
        - switch-a2:eth2
        - switch-b2:eth2
    # The host2 bond to pair A and the host1 bond to pair B.
    - endpoints:
        - switch-a1:eth3
        - host2:eth1
    - endpoints:
        - switch-a2:eth3
        - host2:eth2
    - endpoints:
        - switch-b1:eth3
        - host1:eth1
    - endpoints:
        - switch-b2:eth3
        - host1:eth2

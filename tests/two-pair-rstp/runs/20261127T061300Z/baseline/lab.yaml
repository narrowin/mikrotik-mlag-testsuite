streams:
  - name: host1-to-host2
    from: host1:bond0
    to: host2:bond0
  - name: host2-to-host1
    from: host2:bond0
    to: host1:bond0
  - name: bypass-host1-to-host2
    from: host1:eth3
    to: host2:eth3
  - name: bypass-host2-to-host1
    from: host2:eth3
    to: host1:eth3
state:
  - statement: Both MLAG pairs are connected, with switch-a1 and switch-b1 as MLAG primaries.
    checks:
      - device: switch-a1
        check: mlag
        params: &bridge
          bridge: bridge
        expected: &primary
          connected: true
          role: primary
      - device: switch-a2
        check: mlag
        params: *bridge
        expected: &secondary
          connected: true
          role: secondary
      - device: switch-b1
        check: mlag
        params: *bridge
        expected: *primary
      - device: switch-b2
        check: mlag
        params: *bridge
        expected: *secondary
  - statement: All four switches run RSTP.
    checks:
      - device: switch-a1
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch-a2
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch-b1
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch-b2
        check: stp_mode
        params: *bridge
        expected: rstp
  - statement: Pair A is the RSTP root bridge with switch-a1's bridge ID, and pair B reaches it through the inter-pair bond.
    checks:
      - device: switch-a1
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true, root_bridge_id: "0x2000.02:00:00:21:00:11"}
      - device: switch-a2
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true, root_bridge_id: "0x2000.02:00:00:21:00:11"}
      - device: switch-b1
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: false, root_bridge_id: "0x2000.02:00:00:21:00:11", root_port: inter-pair}
      - device: switch-b2
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: false, root_bridge_id: "0x2000.02:00:00:21:00:11", root_port: inter-pair}
  - statement: Every bridge port of the four switches forwards, and the host ports are edge ports.
    checks:
      - device: switch-a1
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch-a1
        check: bridge_port
        params: {bridge: bridge, port: inter-pair}
        expected: {forwarding: true}
      - device: switch-a1
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: switch-a2
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch-a2
        check: bridge_port
        params: {bridge: bridge, port: inter-pair}
        expected: {forwarding: true}
      - device: switch-a2
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: switch-b1
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch-b1
        check: bridge_port
        params: {bridge: bridge, port: inter-pair}
        expected: {forwarding: true}
      - device: switch-b1
        check: bridge_port
        params: {bridge: bridge, port: host1}
        expected: {forwarding: true, edge: true}
      - device: switch-b2
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch-b2
        check: bridge_port
        params: {bridge: bridge, port: inter-pair}
        expected: {forwarding: true}
      - device: switch-b2
        check: bridge_port
        params: {bridge: bridge, port: host1}
        expected: {forwarding: true, edge: true}
  - statement: The inter-pair bond runs with lacp-strict=no on all four switches.
    checks:
      - device: switch-a1
        check: property
        params: &strict
          menu: /interface/bonding
          where:
            name: inter-pair
          name: lacp-strict
        expected: false
      - device: switch-a2
        check: property
        params: *strict
        expected: false
      - device: switch-b1
        check: property
        params: *strict
        expected: false
      - device: switch-b2
        check: property
        params: *strict
        expected: false
  - statement: Both inter-pair bond members are synchronized, collecting and distributing at all four ends.
    checks:
      - device: switch-a1
        check: lacp_member
        params: &inter-pair-member
          bond: inter-pair
          member: ether3
        expected: &in-use
          synchronization: true
          collecting: true
          distributing: true
      - device: switch-a2
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
      - device: switch-b1
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
      - device: switch-b2
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
  - statement: Both cables of every host are eligible in its LACP bond.
    checks:
      - device: host1
        check: bond_member
        params: &first-member
          bond: bond0
          member: eth1
        expected: &eligible
          carrier: true
          eligible: true
      - device: host1
        check: bond_member
        params: &second-member
          bond: bond0
          member: eth2
        expected: *eligible
      - device: host2
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: host2
        check: bond_member
        params: *second-member
        expected: *eligible
switch_log: syslog/switches.log

streams:
  - name: host1-to-host2
    from: host1:eth1
    to: host2:bond0
  - name: host2-to-host1
    from: host2:bond0
    to: host1:eth1
state:
  - statement: Switch1 is the connected MLAG primary and switch2 the connected MLAG secondary.
    checks:
      - device: switch1
        check: mlag
        params: &bridge
          bridge: bridge
        expected:
          connected: true
          role: primary
      - device: switch2
        check: mlag
        params: *bridge
        expected:
          connected: true
          role: secondary
  - statement: All three switches run RSTP.
    checks:
      - device: switch1
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: switch2
        check: stp_mode
        params: *bridge
        expected: rstp
      - device: access-switch
        check: stp_mode
        params: *bridge
        expected: rstp
  - statement: The access switch is the RSTP root bridge, and both MLAG peers reach it through their MLAG bond to it.
    checks:
      - device: switch1
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: false, root_bridge_id: "0x1000.02:00:00:21:01:03", root_port: access-switch}
      - device: switch2
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: false, root_bridge_id: "0x1000.02:00:00:21:01:03", root_port: access-switch}
      - device: access-switch
        check: stp_bridge
        params: *bridge
        expected: {root_bridge: true, root_bridge_id: "0x1000.02:00:00:21:01:03"}
  - statement: Every bridge port of the three switches forwards, and the host ports are edge ports.
    checks:
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: access-switch}
        expected: {forwarding: true}
      - device: switch1
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: ether2}
        expected: {forwarding: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: access-switch}
        expected: {forwarding: true}
      - device: switch2
        check: bridge_port
        params: {bridge: bridge, port: host2}
        expected: {forwarding: true, edge: true}
      - device: access-switch
        check: bridge_port
        params: {bridge: bridge, port: uplink}
        expected: {forwarding: true}
      - device: access-switch
        check: bridge_port
        params: {bridge: bridge, port: ether4}
        expected: {forwarding: true, edge: true}
  - statement: Both bond members of the access switch uplink are synchronized, collecting and distributing.
    checks:
      - device: access-switch
        check: lacp_member
        params:
          bond: uplink
          member: ether2
        expected: &in-use
          synchronization: true
          collecting: true
          distributing: true
      - device: access-switch
        check: lacp_member
        params:
          bond: uplink
          member: ether3
        expected: *in-use
  - statement: Both bond members of host2 have carrier and are eligible in its LACP bond.
    checks:
      - device: host2
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected: &eligible
          carrier: true
          eligible: true
      - device: host2
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected: *eligible
switch_log: syslog/switches.log

streams:
  - name: host1-to-host2
    from: host1:eth1
    to: host2:bond0
  - name: host2-to-host1
    from: host2:bond0
    to: host1:eth1
  - name: bypass-host1-to-host2
    from: host1:eth3
    to: host2:eth3
  - name: bypass-host2-to-host1
    from: host2:eth3
    to: host1:eth3
state:
  - name: Switch1 is the connected MLAG primary and switch2 the connected MLAG secondary.
    checks:
      - device: switch1
        check: mlag
        params: &bridge
          bridge: bridge
        expected:
          connected: true
          role: primary
      - device: switch2
        check: mlag
        params: *bridge
        expected:
          connected: true
          role: secondary
  - name: All three switches run with spanning tree off.
    checks:
      - device: switch1
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch2
        check: stp_mode
        params: *bridge
        expected: none
      - device: access-switch
        check: stp_mode
        params: *bridge
        expected: none
  - name: Both bond members of the access switch uplink are synchronized, collecting and distributing.
    checks:
      - device: access-switch
        check: lacp_member
        params:
          bond: uplink
          member: ether2
        expected: &in-use
          synchronization: true
          collecting: true
          distributing: true
      - device: access-switch
        check: lacp_member
        params:
          bond: uplink
          member: ether3
        expected: *in-use
  - name: Both bond members of host2 have carrier and are eligible in its LACP bond.
    checks:
      - device: host2
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected: &eligible
          carrier: true
          eligible: true
      - device: host2
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected: *eligible
switch_log: syslog/switches.log

name: medium-mlag
mgmt:
  network: medium-mlag-mgmt
  # A separate subnet keeps lab management traffic off the host's other Docker networks.
  ipv4-subnet: 172.30.110.0/24
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.26beta7@sha256:b68f34a50544f6464d592cdd07ecc1d08017d6ec6837ac42b7dbe701d3c1ca6a
      startup-config: switch.rsc
      # The startup config reads the collector address and the spanning tree mode from here.
      env:
        COLLECTOR: 172.30.110.10
        STP_MODE: none
        # The spanning-tree root placement, read only when STP_MODE is not none.
        STP_ROOT: pair
  groups:
    hosts:
      kind: linux
      image: mlag-host:local
      binds:
        - host-setup.sh:/lab/host-setup.sh:ro
      exec:
        - sh /lab/host-setup.sh
      # The deploy returns only when all three switches answer.
      stages:
        create:
          wait-for:
            - node: switch1
              stage: healthy
            - node: switch2
              stage: healthy
            - node: access-switch
              stage: healthy
  nodes:
    syslog:
      kind: linux
      image: rsyslog/rsyslog@sha256:cac80b5513d78de76c301151e4d248547bcf2b5161d9c891a4b10c302f76dd56
      # The image's own user cannot write into the lab folder that containerlab creates as root.
      user: "0"
      # All three switches send their log to this fixed collector address.
      mgmt-ipv4: 172.30.110.10
      binds:
        - ../../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - __clabNodeDir__:/logs
    switch1:
      kind: mikrotik_chr
    switch2:
      kind: mikrotik_chr
    access-switch:
      kind: mikrotik_chr
    host1:
      group: hosts
    host2:
      group: hosts
  links:
    # A CHR's ethN maps to RouterOS ether(N+1) because ether1 is management.
    # The peer link.
    - endpoints:
        - switch1:eth1
        - switch2:eth1
    # The access switch bond to both peers.
    - endpoints:
        - switch1:eth2
        - access-switch:eth1
    - endpoints:
        - switch2:eth2
        - access-switch:eth2
    # The host2 bond to both peers.
    - endpoints:
        - switch1:eth3
        - host2:eth1
    - endpoints:
        - switch2:eth3
        - host2:eth2
    # Host1 behind the access switch.
    - endpoints:
        - access-switch:eth3
        - host1:eth1

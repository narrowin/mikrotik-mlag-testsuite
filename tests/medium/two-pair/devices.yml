general:
  # A redeployed lab has new host keys, so none are stored.
  ssh_known_hosts_file: /dev/null
devices:
  switch-a1: &switch
    device_type: mikrotik_routeros
  switch-a2: *switch
  switch-b1: *switch
  switch-b2: *switch
  host1: &host
    device_type: linux
  host2: *host
groups:
  switches:
    description: Both MLAG pairs, using the CHR default login
    members:
      - switch-a1
      - switch-a2
      - switch-b1
      - switch-b2
    credentials:
      user: admin
      password: admin
  hosts:
    description: Linux hosts
    members:
      - host1
      - host2
    credentials:
      user: root
      password: admin

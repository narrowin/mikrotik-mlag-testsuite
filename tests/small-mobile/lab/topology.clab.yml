name: small-mlag-mobile
mgmt:
  network: small-mlag-mobile-mgmt
  ipv4-subnet: 172.30.101.0/24
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.26beta7@sha256:b68f34a50544f6464d592cdd07ecc1d08017d6ec6837ac42b7dbe701d3c1ca6a
      startup-config: switch.rsc
      env:
        SMALL_MOBILE_AGE: ${SMALL_MOBILE_AGE:=5m}
  groups:
    clients:
      kind: linux
      image: small-mlag-client:local
      binds:
        - host-setup.sh:/lab/host-setup.sh:ro
      env:
        SMALL_MOBILE_AGE: ${SMALL_MOBILE_AGE:=5m}
      exec:
        - sh /lab/host-setup.sh
      stages:
        create:
          wait-for:
            - node: switch1
              stage: healthy
            - node: switch2
              stage: healthy
  nodes:
    syslog:
      kind: linux
      image: rsyslog/rsyslog@sha256:cac80b5513d78de76c301151e4d248547bcf2b5161d9c891a4b10c302f76dd56
      user: "0"
      mgmt-ipv4: 172.30.101.10
      binds:
        - ../../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - __clabNodeDir__:/logs
    switch1:
      kind: mikrotik_chr
    switch2:
      kind: mikrotik_chr
    client1:
      group: clients
    client2:
      group: clients
    client3:
      group: clients
  links:
    # Container ethN maps to RouterOS ether(N+1). The first port is management.
    - endpoints:
        - switch1:eth1
        - switch2:eth1
    - endpoints:
        - client1:eth1
        - switch1:eth2
    - endpoints:
        - client1:eth2
        - switch2:eth2
    - endpoints:
        - client2:eth1
        - switch1:eth3
    - endpoints:
        - client2:eth2
        - switch2:eth3
    - endpoints:
        - client3:eth1
        - switch1:eth4
    - endpoints:
        - client3:eth2
        - switch2:eth4
    - endpoints:
        - client1:eth3
        - client2:eth3

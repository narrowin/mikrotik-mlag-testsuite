name: mac-move
purpose: >-
  Move the active-backup host to the other switch and back without changing its
  MAC or IP address. Check the gratuitous ARP at the new TAP and unicast at the old TAP.
lab: ../lab/link-lab.yaml
steps:
  - name: Mobile moves to switch2
    action:
      active_member: &mobile client3:bond0
      member: eth2
    hold_s: 4  # Keep the host on switch2 for four seconds before moving it back.
    max_outage_s: &limits
      client1-to-mobile: 0
      client2-to-mobile: 0
      mobile-to-client1: 0
      mobile-to-client2: 0
      client1-to-client2: 0
      bypass-client1-to-client2: 0
      bypass-client2-to-client1: 0
    expected: Every stream delivers and no frame addressed to the mobile host uses the old cable after its gratuitous ARP.
    check_state:
      - statement: Both switches learned the mobile host on the new path.
        checks:
          - device: switch1
            check: host_entry
            params: &host
              bridge: bridge
              mac: "02:00:00:11:00:50"
            expected: ether2
          - device: switch2
            check: host_entry
            params: *host
            expected: ether5
  - name: Mobile moves back to switch1
    action:
      active_member: *mobile
      member: eth1
    hold_s: 3  # Watch forwarding for three seconds after the return.
    max_outage_s: *limits
    expected: Every stream delivers and the second gratuitous ARP ends unicast on the other cable.
    check_state:
      - statement: Both switches learned the mobile host on its original path.
        checks:
          - device: switch1
            check: host_entry
            params: *host
            expected: ether5
          - device: switch2
            check: host_entry
            params: *host
            expected: ether2
  - name: Mobile recovery
    action:
      observe: true
    hold_s: 3  # Verify another three seconds of delivery without a frame on the old cable.
    max_outage_s: *limits
    expected: Every stream continues to deliver after the host returns.

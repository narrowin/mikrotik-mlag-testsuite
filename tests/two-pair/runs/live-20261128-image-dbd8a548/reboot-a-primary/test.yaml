name: reboot-a-primary
purpose: >-
  Reboot switch-a1 in its checked MLAG primary role of pair A and measure both directions between the hosts.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: ../lab/lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of uninterrupted traffic before the reboot.
    max_outage_s:
      host1-to-host2: 0
      host2-to-host1: 0
    expected: Every ping arrives once before the reboot.
  - name: Reboot switch-a1
    action:
      reboot: switch-a1
    # Allow boot and LACP recovery, plus the CHR SSH cooldown if it refuses an early login.
    recovery_deadline_s: 60
    # Continue through the post-boot observation, beyond five fast LACP timeouts.
    hold_s: 16
    max_outage_s:
      host1-to-host2: &reboot-limit 5  # Local availability limit retained from the original tests, not a RouterOS maximum; see docs/adr/0003.
      host2-to-host1: *reboot-limit
    expected: switch-a1 has a new boot. Its peer reverts the MLAG bonds to its own LACP system ID, so pair B and host2 renegotiate LACP, and every bond returns to service under the shared system ID.
  - name: Reboot recovery
    action:
      observe: true
    hold_s: 3  # A fast LACP timeout yields 30 pings at the 100 ms cadence.
    max_outage_s:
      host1-to-host2: 0
      host2-to-host1: 0
    expected: Every stream keeps delivering after the reboot.

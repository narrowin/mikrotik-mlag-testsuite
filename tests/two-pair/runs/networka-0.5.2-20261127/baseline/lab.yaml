streams:
  - name: host1-to-host2
    from: host1:bond0
    to: host2:bond0
  - name: host2-to-host1
    from: host2:bond0
    to: host1:bond0
state:
  - name: Both MLAG pairs are connected, with switch-a1 and switch-b1 as MLAG primaries.
    checks:
      - device: switch-a1
        check: mlag
        params: &bridge
          bridge: bridge
        expected: &primary
          connected: true
          role: primary
      - device: switch-a2
        check: mlag
        params: *bridge
        expected: &secondary
          connected: true
          role: secondary
      - device: switch-b1
        check: mlag
        params: *bridge
        expected: *primary
      - device: switch-b2
        check: mlag
        params: *bridge
        expected: *secondary
  - name: All four switches run with spanning tree off.
    checks:
      - device: switch-a1
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch-a2
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch-b1
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch-b2
        check: stp_mode
        params: *bridge
        expected: none
  - name: The inter-pair bond runs with lacp-strict=no on all four switches.
    checks:
      - device: switch-a1
        check: property
        params: &strict
          menu: /interface/bonding
          where:
            name: inter-pair
          name: lacp-strict
        expected: false
      - device: switch-a2
        check: property
        params: *strict
        expected: false
      - device: switch-b1
        check: property
        params: *strict
        expected: false
      - device: switch-b2
        check: property
        params: *strict
        expected: false
  - name: Both inter-pair bond members are synchronized, collecting and distributing at all four ends.
    checks:
      - device: switch-a1
        check: lacp_member
        params: &inter-pair-member
          bond: inter-pair
          member: ether3
        expected: &in-use
          synchronization: true
          collecting: true
          distributing: true
      - device: switch-a2
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
      - device: switch-b1
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
      - device: switch-b2
        check: lacp_member
        params: *inter-pair-member
        expected: *in-use
  - name: Both cables of every host are eligible in its LACP bond.
    checks:
      - device: host1
        check: bond_member
        params: &first-member
          bond: bond0
          member: eth1
        expected: &eligible
          carrier: true
          eligible: true
      - device: host1
        check: bond_member
        params: &second-member
          bond: bond0
          member: eth2
        expected: *eligible
      - device: host2
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: host2
        check: bond_member
        params: *second-member
        expected: *eligible
switch_log: syslog/switches.log

name: baseline
purpose: >-
  Check forwarding in both directions between the hosts across both MLAG pairs, and on the independent bypass.
  Both host streams cross the inter-pair bond.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: lab.yaml
steps:
  - name: Steady traffic
    action:
      observe: true
    hold_s: 4  # Observe one interval beyond the three-second fast LACP timeout.
    max_outage_s:
      host1-to-host2: 0
      host2-to-host1: 0
      bypass-host1-to-host2: 0
      bypass-host2-to-host1: 0
    expected: Both pairs stay connected and every ping arrives once.
    check_state:
      - name: Every host bond member on the switches is synchronized, collecting and distributing.
        checks:
          - device: switch-a1
            check: lacp_member
            params: &host2-member
              bond: host2
              member: ether4
            expected: &in-use
              synchronization: true
              collecting: true
              distributing: true
          - device: switch-a2
            check: lacp_member
            params: *host2-member
            expected: *in-use
          - device: switch-b1
            check: lacp_member
            params: &host1-member
              bond: host1
              member: ether4
            expected: *in-use
          - device: switch-b2
            check: lacp_member
            params: *host1-member
            expected: *in-use
      - name: The inter-pair bond and the host bond are forwarding bridge ports on all four switches.
        checks:
          - device: switch-a1
            check: bridge_port
            params: &inter-pair-port
              bridge: bridge
              port: inter-pair
            expected: &forwarding
              forwarding: true
          - device: switch-a2
            check: bridge_port
            params: *inter-pair-port
            expected: *forwarding
          - device: switch-b1
            check: bridge_port
            params: *inter-pair-port
            expected: *forwarding
          - device: switch-b2
            check: bridge_port
            params: *inter-pair-port
            expected: *forwarding
          - device: switch-a1
            check: bridge_port
            params: &host2-port
              bridge: bridge
              port: host2
            expected: *forwarding
          - device: switch-a2
            check: bridge_port
            params: *host2-port
            expected: *forwarding
          - device: switch-b1
            check: bridge_port
            params: &host1-port
              bridge: bridge
              port: host1
            expected: *forwarding
          - device: switch-b2
            check: bridge_port
            params: *host1-port
            expected: *forwarding

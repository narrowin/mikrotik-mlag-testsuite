name: calibration
purpose: Verify that measurement can bound a two-second one-way loss without loss on the other three streams.
lab: ../lab/lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of steady traffic before the calibration cut.
    max_outage_s: &clear-limits
      host1-to-host2: 0
      host2-to-host1: 0
      bypass-host1-to-host2: 0
      bypass-host2-to-host1: 0
    expected: Both directions on both paths deliver throughout the baseline.
  - name: One-way bypass cut
    action:
      cut_ping: bypass-host1-to-host2
      at: host2:eth3
    hold_s: 2  # The known interruption that the capture must measure.
    max_outage_s: &cut-limits
      host1-to-host2: 0
      host2-to-host1: 0
      bypass-host1-to-host2: 2.3  # The two-second injection plus up to three 100 ms probe intervals.
      bypass-host2-to-host1: 0
    expected: Only forward bypass requests are lost, and their measured gap encloses the cut.
  - name: Bypass restored
    action:
      cut_ping: bypass-host1-to-host2
      clear: true
    hold_s: 3  # A loss-free recovery yields 30 pings at the 100 ms cadence.
    max_outage_s: *cut-limits
    expected: The known gap ends and all four paths deliver again.
  - name: After calibration
    action:
      observe: true
    hold_s: 3  # Check consecutive delivery over another full fast LACP timeout.
    max_outage_s: *clear-limits
    expected: Every path continues to deliver after the cut.

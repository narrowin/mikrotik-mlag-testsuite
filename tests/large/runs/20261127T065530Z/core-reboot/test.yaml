name: core-reboot
purpose: >-
  Reboot the core MLAG primary at dc1, then at dc2, while measuring both sites and both DCI directions.
  Each reboot must leave the site streams untouched and the DCI must recover through the surviving core.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: ../lab/lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of uninterrupted traffic before the first reboot.
    max_outage_s: &loss-free
      dc1-traffic-to-dc1-service: 0
      dc2-traffic-to-dc2-service: 0
      dc1-to-dc2-over-dci: 0
      dc2-to-dc1-over-dci: 0
    expected: Every ping arrives once before the reboot.
  - name: Reboot dc1-core1
    action:
      reboot: dc1-core1
    # Allow boot and LACP recovery, plus the CHR SSH cooldown if it refuses an early login.
    wait_healthy_s: 60
    # Continue through the post-boot observation, beyond five fast LACP timeouts.
    hold_s: 16
    max_outage_s: &reboot-limits
      # The site VLAN never reaches the cores.
      dc1-traffic-to-dc1-service: 0
      dc2-traffic-to-dc2-service: 0
      dc1-to-dc2-over-dci: &reboot-limit 5  # Three fast LACP intervals plus two for forwarding.
      dc2-to-dc1-over-dci: *reboot-limit
    expected: dc1-core1 has a new boot, returns as MLAG primary and the DCI carries both directions again.
  - name: dc1 reboot recovery
    action:
      observe: true
    hold_s: 3  # A fast LACP timeout yields 30 pings at the 100 ms cadence.
    max_outage_s: *loss-free
    expected: Every stream keeps delivering after the reboot.
  - name: Reboot dc2-core1
    action:
      reboot: dc2-core1
    wait_healthy_s: 60
    hold_s: 16
    max_outage_s: *reboot-limits
    expected: dc2-core1 has a new boot, returns as MLAG primary and the DCI carries both directions again.
  - name: dc2 reboot recovery
    action:
      observe: true
    hold_s: 3
    max_outage_s: *loss-free
    expected: Every stream keeps delivering after the reboot.

name: large-mlag
mgmt:
  network: large-mlag-mgmt
  # A separate subnet keeps lab management traffic off the host's other Docker networks.
  ipv4-subnet: 172.30.120.0/24
topology:
  kinds:
    mikrotik_chr:
      image: mikrotik/chr:7.26beta7@sha256:b68f34a50544f6464d592cdd07ecc1d08017d6ec6837ac42b7dbe701d3c1ca6a
      startup-config: routeros.rsc
  groups:
    hosts:
      kind: linux
      image: small-mlag-client:local
      binds:
        - host-setup.sh:/lab/host-setup.sh:ro
      exec:
        - sh /lab/host-setup.sh
      # The deploy returns only when every RouterOS node answers.
      stages:
        create:
          wait-for:
            - node: dc1-core1
              stage: healthy
            - node: dc1-core2
              stage: healthy
            - node: dc1-dist1
              stage: healthy
            - node: dc1-dist2
              stage: healthy
            - node: dc1-firewall
              stage: healthy
            - node: dc2-core1
              stage: healthy
            - node: dc2-core2
              stage: healthy
            - node: dc2-dist1
              stage: healthy
            - node: dc2-dist2
              stage: healthy
            - node: dc2-firewall
              stage: healthy
  nodes:
    syslog:
      kind: linux
      image: rsyslog/rsyslog@sha256:cac80b5513d78de76c301151e4d248547bcf2b5161d9c891a4b10c302f76dd56
      # The image's own user cannot write into the lab folder that containerlab creates as root.
      user: "0"
      # Every RouterOS node sends its log to this fixed collector address.
      mgmt-ipv4: 172.30.120.10
      binds:
        - ../../shared/rsyslog.conf:/etc/rsyslog.conf:ro
        - __clabNodeDir__:/logs
    dc1-core1:
      kind: mikrotik_chr
    dc1-core2:
      kind: mikrotik_chr
    dc1-dist1:
      kind: mikrotik_chr
    dc1-dist2:
      kind: mikrotik_chr
    dc1-firewall:
      kind: mikrotik_chr
    dc1-traffic:
      group: hosts
    dc1-service:
      group: hosts
    dc2-core1:
      kind: mikrotik_chr
    dc2-core2:
      kind: mikrotik_chr
    dc2-dist1:
      kind: mikrotik_chr
    dc2-dist2:
      kind: mikrotik_chr
    dc2-firewall:
      kind: mikrotik_chr
    dc2-traffic:
      group: hosts
    dc2-service:
      group: hosts
  links:
    # A CHR's ethN maps to RouterOS ether(N+1) because ether1 is management.
    # dc1: peer links, distribution-to-core trunk, firewall bond, host bonds.
    - endpoints:
        - dc1-core1:eth1
        - dc1-core2:eth1
    - endpoints:
        - dc1-dist1:eth1
        - dc1-dist2:eth1
    - endpoints:
        - dc1-core1:eth2
        - dc1-dist1:eth2
    - endpoints:
        - dc1-core2:eth2
        - dc1-dist2:eth2
    - endpoints:
        - dc1-firewall:eth1
        - dc1-core1:eth4
    - endpoints:
        - dc1-firewall:eth2
        - dc1-core2:eth4
    - endpoints:
        - dc1-traffic:eth1
        - dc1-dist1:eth3
    - endpoints:
        - dc1-traffic:eth2
        - dc1-dist2:eth3
    - endpoints:
        - dc1-service:eth1
        - dc1-dist1:eth4
    - endpoints:
        - dc1-service:eth2
        - dc1-dist2:eth4
    # dc2: the same wiring.
    - endpoints:
        - dc2-core1:eth1
        - dc2-core2:eth1
    - endpoints:
        - dc2-dist1:eth1
        - dc2-dist2:eth1
    - endpoints:
        - dc2-core1:eth2
        - dc2-dist1:eth2
    - endpoints:
        - dc2-core2:eth2
        - dc2-dist2:eth2
    - endpoints:
        - dc2-firewall:eth1
        - dc2-core1:eth4
    - endpoints:
        - dc2-firewall:eth2
        - dc2-core2:eth4
    - endpoints:
        - dc2-traffic:eth1
        - dc2-dist1:eth3
    - endpoints:
        - dc2-traffic:eth2
        - dc2-dist2:eth3
    - endpoints:
        - dc2-service:eth1
        - dc2-dist1:eth4
    - endpoints:
        - dc2-service:eth2
        - dc2-dist2:eth4
    # The DCI: two straight members of one distributed trunk between the core pairs.
    - endpoints:
        - dc1-core1:eth3
        - dc2-core1:eth3
    - endpoints:
        - dc1-core2:eth3
        - dc2-core2:eth3

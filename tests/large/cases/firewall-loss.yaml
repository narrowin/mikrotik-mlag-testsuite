name: firewall-loss
purpose: >-
  Withdraw all data links of the dc1 firewall and pause its guest before a cold reset.
  The dc2 firewall must take over the VRRP address, and dc1 must take it back after power returns.
  No stream crosses a firewall, so every stream must continue.
source: https://manual.mikrotik.com/docs/high-availability-solutions/user-guides/vrrp-configuration-examples/
lab: ../lab/lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of steady traffic before power loss.
    max_outage_s: &loss-free
      dc1-traffic-to-dc1-service: 0
      dc2-traffic-to-dc2-service: 0
      dc1-to-dc2-over-dci: 0
      dc2-to-dc1-over-dci: 0
      bypass-dc1-to-dc2: 0
      bypass-dc2-to-dc1: 0
    expected: Every ping arrives once before power loss.
  - name: dc1-firewall power lost
    action:
      power_off: dc1-firewall
    # Keep the firewall off well past three missed one-second VRRP advertisements and the fast LACP timeout.
    hold_s: 20
    max_outage_s: *loss-free
    expected: Both dc1 cores see carrier go down and the dc2 firewall becomes VRRP master.
    check_state:
      - statement: The dc2 firewall owns the VRRP address.
        checks:
          - device: dc2-firewall
            check: property
            params:
              menu: /interface/vrrp
              where:
                name: vrrp390
              name: master
            expected: true
  - name: dc1-firewall power restored
    action:
      power_on: dc1-firewall
    # The Small power-loss recovery deadline: CHR cold boot, SSH cooldown and the default 60 s MLAG initialisation interval.
    wait_healthy_s: 180
    hold_s: 16  # Continue through the observation after boot, beyond five fast LACP timeouts.
    max_outage_s: *loss-free
    expected: The dc1 firewall has a new boot, rejoins its bond and preempts the VRRP address from dc2.
  - name: Power recovery
    action:
      observe: true
    hold_s: 3  # A fast LACP timeout yields 30 pings at the 100 ms cadence.
    max_outage_s: *loss-free
    expected: Every stream keeps delivering after power returns.

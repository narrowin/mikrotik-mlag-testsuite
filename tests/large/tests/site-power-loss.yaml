name: site-power-loss
purpose: >-
  Cut power to the whole dc1 site at once: both cores, both distribution switches, the firewall and both hosts.
  dc2 must keep forwarding inside its site, and the dc2 firewall must take over the VRRP address.
  After power returns, dc1 must boot, rejoin the DCI and take the VRRP address back.
source: https://manual.mikrotik.com/docs/high-availability-solutions/user-guides/vrrp-configuration-examples/
lab: ../lab/lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of steady traffic before power loss.
    max_outage_s: &loss-free
      dc1-traffic-to-dc1-service: 0
      dc2-traffic-to-dc2-service: 0
      dc1-to-dc2-over-dci: 0
      dc2-to-dc1-over-dci: 0
      dc1-traffic-to-vrrp: 0
      dc2-traffic-to-vrrp: 0
    expected: Every ping arrives once before power loss.
  - name: dc1 power lost
    action:
      power_off: &dc1
        - dc1-core1
        - dc1-core2
        - dc1-dist1
        - dc1-dist2
        - dc1-firewall
        - dc1-traffic
        - dc1-service
    # Keep dc1 off well past three missed one-second VRRP advertisements and the fast LACP timeout, as in the firewall-loss test.
    hold_s: 20
    max_outage_s: &site-limits
      # dc1 has no power, so these streams have no path until it is back.
      # The limit spans this hold, the power return deadline and the hold after it, 20 + 180 + 16 s, so it only requires that dc1 traffic returns within the test.
      dc1-traffic-to-dc1-service: &dc1-back 216
      dc1-to-dc2-over-dci: *dc1-back
      dc2-to-dc1-over-dci: *dc1-back
      dc1-traffic-to-vrrp: *dc1-back
      # The dc2 site VLAN stays on the dc2 distribution pair, which keeps its power.
      dc2-traffic-to-dc2-service: 0
      # RFC 5798 Master_Down_Interval for the dc2 firewall: 3 x 1 s advertisements + (256 - 100) / 256 s skew = 3.61 s, rounded up to cover one ping interval and the host-table move. The same bound applies when dc1 preempts the address on return.
      dc2-traffic-to-vrrp: &vrrp-move 4
    expected: The dc2 cores see both DCI members go down, dc2 keeps forwarding its site VLAN and the dc2 firewall becomes VRRP master.
    check_state:
      - name: The dc2 firewall owns the VRRP address.
        checks:
          - device: dc2-firewall
            check: property
            params:
              menu: /interface/vrrp
              where:
                name: vrrp390
              name: master
            expected: true
  - name: dc1 power restored
    action:
      power_on: *dc1
    # The Small power-loss recovery deadline: CHR cold boot, SSH cooldown and the default 60 s MLAG initialisation interval.
    recovery_deadline_s: 180
    hold_s: 16  # Continue through the observation after boot, beyond five fast LACP timeouts.
    max_outage_s: *site-limits
    expected: Every dc1 CHR has a new boot, both dc1 pairs and the DCI return, and the dc1 firewall preempts the VRRP address from dc2.
  - name: Power recovery
    action:
      observe: true
    hold_s: 3  # A fast LACP timeout yields 30 pings at the 100 ms cadence.
    max_outage_s: *loss-free
    expected: Every stream keeps delivering after power returns.

name: primary-reboot
purpose: >-
  Reboot switch1 in its checked primary role and measure both directions on the host bonds.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: ../lab/direct-lab.yaml
steps:
  - name: Baseline
    action:
      observe: true
    hold_s: 4  # Four seconds of uninterrupted traffic before the reboot.
    max_outage_s: &loss-free
      host1-to-host2: 0
      host2-to-host1: 0
    expected: Every ping arrives once before the reboot.
  - name: Reboot switch1
    action:
      reboot: switch1
    # Allow boot and LACP recovery, plus the CHR SSH cooldown if it refuses an early login.
    wait_healthy_s: 60
    # Continue through the post-boot observation, beyond five fast LACP timeouts.
    hold_s: 16
    max_outage_s:
      host1-to-host2: &reboot-limit 5  # Three fast LACP intervals plus two for forwarding.
      host2-to-host1: *reboot-limit
    expected: The primary has a new boot and both host bonds return to service.
  - name: Reboot recovery
    action:
      observe: true
    hold_s: 3  # A fast LACP timeout yields 30 pings at the 100 ms cadence.
    max_outage_s: *loss-free
    expected: Every stream keeps delivering after the reboot.

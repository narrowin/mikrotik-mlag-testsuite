name: bond-member-loss
purpose: Withdraw the cable between client1 and switch1, then measure delivery while it returns to the LACP bond.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: ../lab/link-lab.yaml
log:
  must_not:
    - switch: every
      text: heartbeat timeout
steps:
  - name: Client1 cable to switch1 down
    cable: &cable client1:eth1
    state: down
    hold_s: &capture-hold 8  # More than two fast LACP timeouts reveals delayed forwarding failures.
    max_outage_s: &limits
      client1-to-mobile: &member-limit 3  # One fast LACP timeout is the outage budget on affected paths.
      mobile-to-client1: *member-limit
      client1-to-client2: *member-limit
      client2-to-mobile: 0
      mobile-to-client2: 0
    expected: The client reaches the switched paths through switch2.
    check_state:
      - name: The switch sees no carrier on the withdrawn port.
        checks:
          - device: switch1
            check: interface_up
            params: &guest-member
              interface: ether3
            expected: false
    log:
      must:
        - switch: switch1
          text: ether3 link down
  - name: Client1 cable to switch1 back
    cable: *cable
    state: up
    hold_s: *capture-hold
    max_outage_s: *limits
    expected: Both ends of the returned cable agree that it is synchronized, collecting and distributing.
    check_state:
      - name: The switch sees carrier on the returned port and its LACP member is working.
        checks:
          - device: switch1
            check: interface_up
            params: *guest-member
            expected: true
          - device: switch1
            check: lacp_member
            params:
              bond: client1
              member: ether3
            expected:
              synchronization: true
              collecting: true
              distributing: true
    log:
      must:
        - switch: switch1
          text: ether3 link up
  - name: Cable recovery
    action:
      observe: true
    hold_s: 3  # Continue for one fast LACP timeout after the return observation.
    max_outage_s:
      client1-to-mobile: 0
      client2-to-mobile: 0
      mobile-to-client1: 0
      mobile-to-client2: 0
      client1-to-client2: 0
    expected: Every stream delivers after the cable returns.

name: peer-link-loss
purpose: >-
  Withdraw the peer link at both switches, watch the LACP peers separate and rejoin,
  and measure every stream.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: ../lab/link-lab.yaml
steps:
  - name: Peer cable down
    cable: switch1:eth1
    state: down
    # Give ICCP and fast LACP 15 s to converge with the link absent.
    hold_s: 15
    max_outage_s: &limits
      client1-to-mobile: &peer-limit 5  # One fast LACP timeout plus time for MLAG fallback and forwarding.
      client2-to-mobile: *peer-limit
      mobile-to-client1: *peer-limit
      mobile-to-client2: *peer-limit
      client1-to-client2: *peer-limit
    expected: Both peers lose ICCP and the clients keep their cable to the primary.
    check_state:
      - name: Both peer ports have lost carrier and MLAG is disconnected.
        checks:
          - device: switch1
            check: interface_up
            params: &peer
              interface: ether2
            expected: false
          - device: switch2
            check: interface_up
            params: *peer
            expected: false
          - device: switch1
            check: mlag
            params: &bridge
              bridge: bridge
            expected: &disconnected
              connected: false
          - device: switch2
            check: mlag
            params: *bridge
            expected: *disconnected
  - name: Peer cable back
    cable: switch1:eth1
    state: up
    # The default 60 s MLAG init delay plus five fast LACP intervals.
    hold_s: 65
    max_outage_s: *limits
    expected: Both switches reconnect and agree on the shared LACP system ID.
    check_state:
      - name: Both peer ports have carrier again and the peers are connected.
        checks:
          - device: switch1
            check: interface_up
            params: *peer
            expected: true
          - device: switch2
            check: interface_up
            params: *peer
            expected: true
          - device: switch1
            check: mlag
            params: *bridge
            expected: &connected
              connected: true
          - device: switch2
            check: mlag
            params: *bridge
            expected: *connected
  - name: Peer cable recovery
    action:
      observe: true
    # Check the recovery window for longer than two fast LACP intervals.
    hold_s: 3
    max_outage_s:
      client1-to-mobile: 0
      client2-to-mobile: 0
      mobile-to-client1: 0
      mobile-to-client2: 0
      client1-to-client2: 0
    expected: Every stream delivers throughout recovery.

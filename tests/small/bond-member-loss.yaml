# Catalogue case bond-member-loss of src/mlag_lab/intent/small.yaml.
name: MLAG bond member loss and return
purpose: >-
  Client 1's cable to CHR 1 goes down for 8 s and then comes back.
  The test checks that client 1's traffic moves to its other cable and back with at most 3 s of loss,
  and that traffic that does not use this cable loses no ping.
source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
lab: lab.yaml
steps:
  - name: Member down
    action:
      link: dc1-traffic-host1:eth1
      state: down
    hold_s: 8
    expected: >-
      The cable goes down at both ends.
      CHR 1 stops using ether3 for client 1's bond, and client 1 sends only on its cable to CHR 2.
      CHR 1 sends traffic for client 1 over the peer link to CHR 2, which delivers it on its cable of the same bond.
      Client 1's traffic may stop for a short time.
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
    expect:
      # Streams that use client 1's bond may stop for up to 3 s.
      - streams:
          - 101
          - 201
          - 302
        max_outage_s: 3
      # Streams that do not use the cable must not lose a probe.
      - streams:
          - 102
          - 202
        max_outage_s: 0
  # The hold is the suite's 8 s with the cable up plus its 3 s recovery window.
  - name: Member back
    action:
      link: dc1-traffic-host1:eth1
      state: up
    hold_s: 11
    expected: >-
      The cable comes back at both ends.
      LACP on CHR 1 and on client 1 takes ether3 back into the bond, with one LACP message per second.
      Each end sends traffic on the cable only once LACP shows it as synchronized, collecting and distributing.
      Client 1's traffic may stop for a short time.
    source: https://manual.mikrotik.com/docs/cli-reference/interface/bonding/monitor-slaves/
    expect:
      # Streams that use client 1's bond may stop for up to 3 s.
      - streams:
          - 101
          - 201
          - 302
        max_outage_s: 3
      # Streams that do not use the cable must not lose a probe.
      - streams:
          - 102
          - 202
        max_outage_s: 0

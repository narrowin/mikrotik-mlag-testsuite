general:
  # A redeployed lab has new host keys, so none are stored.
  ssh_known_hosts_file: /dev/null
devices:
  switch1: &switch
    device_type: mikrotik_routeros
  switch2: *switch
  client1: &client
    device_type: linux
  client2: *client
  client3: *client
groups:
  switches:
    description: MLAG peers using the CHR default login
    members:
      - switch1
      - switch2
    credentials:
      user: admin
      password: admin
  clients:
    description: Linux clients
    members:
      - client1
      - client2
      - client3
    credentials:
      user: root
      password: admin

name: cable-delay
purpose: Delay traffic leaving host1 on its cable to switch2 while measuring delivery on both streams.
lab: ../lab/lab.yaml
steps:
  - name: Delay on host1 cable
    action:
      impair: &cable host1:eth2
      direction: out
      delay_ms: 50  # Reproduce the measured 50 ms netem trial, below the late-reply threshold.
      delay_stream: host1-to-host2
    hold_s: 5  # Send 50 pings per stream at the 100 ms cadence while the rule is active.
    max_outage_s: &limits
      host1-to-host2: 0
      host2-to-host3: 0
    expected: Pings continue to deliver with the queue installed.
  - name: Cable delay cleared
    action:
      impair: *cable
      clear: true
    recovery_deadline_s: 10  # Allow three fast LACP timeouts if the bond needs to settle.
    hold_s: 3  # Watch for a further fast LACP timeout after the lab is healthy.
    max_outage_s: *limits
    expected: The cable returns to its default queue and all pings keep arriving.

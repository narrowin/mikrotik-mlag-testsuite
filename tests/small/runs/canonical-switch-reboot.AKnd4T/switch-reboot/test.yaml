name: switch-reboot
purpose: >-
  Reboot switch1 in its current MLAG role while measuring both client streams.
  Verify that RouterOS restarted, then wait for MLAG and all client bonds to recover.
lab: lab.yaml
steps:
  - name: Reboot switch1
    action:
      reboot: switch1
    # Prior CHR trials recovered within 21 s. Allow a 30 s SSH login cooldown and one 5 s retry.
    recovery_deadline_s: 60
    # Watch the recovered lab for longer than one 3 s fast-LACP timeout.
    hold_s: 5
    max_outage_s:
      # Either stream can use switch1. Allow one fast-LACP timeout plus one message interval.
      client1-to-client2: &failover-limit 4
      client2-to-client3: *failover-limit
    expected: switch1 has a new boot and both streams recover through the surviving peer within the limit.

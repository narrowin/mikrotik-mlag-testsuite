streams:
  # Pings go from client 1 through the switches to client 2, and the replies come back the same way.
  - name: client1-to-client2
    from: client1:bond0
    to: client2:bond0
  # Pings go from client 2 through the switches to client 3, and no ping uses a cable of client 1.
  - name: client2-to-client3
    from: client2:bond0
    to: client3:bond0
state:
  - statement: Both switches show MLAG connected.
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
    checks:
      - name: switch1 MLAG connected
        device: switch1
        check: mlag
        params:
          bridge: bridge
        expected:
          connected: true
      - name: switch2 MLAG connected
        device: switch2
        check: mlag
        params:
          bridge: bridge
        expected:
          connected: true
  - statement: Both switches run with spanning tree off.
    checks:
      - name: switch1 spanning tree off
        device: switch1
        check: stp_mode
        params:
          bridge: bridge
        expected: none
      - name: switch2 spanning tree off
        device: switch2
        check: stp_mode
        params:
          bridge: bridge
        expected: none
  - statement: Each client's bond uses both cables, so both switches present one LACP system to it.
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
    checks:
      - name: client1 cable to switch1 in the bond
        device: client1
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected:
          eligible: true
      - name: client1 cable to switch2 in the bond
        device: client1
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected:
          eligible: true
      - name: client2 cable to switch1 in the bond
        device: client2
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected:
          eligible: true
      - name: client2 cable to switch2 in the bond
        device: client2
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected:
          eligible: true
      - name: client3 cable to switch1 in the bond
        device: client3
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected:
          eligible: true
      - name: client3 cable to switch2 in the bond
        device: client3
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected:
          eligible: true
# The collector's file inside the containerlab lab folder.
switch_log: syslog/switches.log

# What all lab tests of the Small lab share, with spanning tree off.
# Every test checks the state before its first step and after its last step.
# The checks come from src/mlag_lab/intent/state/direct.yaml, direct-none.yaml and hosts.yaml.
# Networka reads the CHRs and the Linux clients over SSH.
state:
  - statement: Both MLAG peers show mlag-state connected.
    source: https://manual.mikrotik.com/docs/high-availability-solutions/multi-chassis-link-aggregation-group/
    checks:
      - name: mlag1 MLAG connected
        device: dc1-core-mlag1
        check: mlag
        params:
          bridge: bridge
        expected:
          connected: true
      - name: mlag2 MLAG connected
        device: dc1-core-mlag2
        check: mlag
        params:
          bridge: bridge
        expected:
          connected: true
  - statement: Each MLAG peer carries each client bond on its one member, which LACP shows as synchronized, collecting and distributing.
    source: https://manual.mikrotik.com/docs/cli-reference/interface/bonding/monitor-slaves/
    checks:
      - name: mlag1 client1 members ether3
        device: dc1-core-mlag1
        check: bond_members
        params:
          bond: client1
        expected:
          - ether3
      - name: mlag1 client1 member ether3 in use
        device: dc1-core-mlag1
        check: lacp_member
        params:
          bond: client1
          member: ether3
        expected:
          synchronization: true
          collecting: true
          distributing: true
      - name: mlag1 client2 members ether4
        device: dc1-core-mlag1
        check: bond_members
        params:
          bond: client2
        expected:
          - ether4
      - name: mlag1 client2 member ether4 in use
        device: dc1-core-mlag1
        check: lacp_member
        params:
          bond: client2
          member: ether4
        expected:
          synchronization: true
          collecting: true
          distributing: true
      - name: mlag2 client1 members ether3
        device: dc1-core-mlag2
        check: bond_members
        params:
          bond: client1
        expected:
          - ether3
      - name: mlag2 client1 member ether3 in use
        device: dc1-core-mlag2
        check: lacp_member
        params:
          bond: client1
          member: ether3
        expected:
          synchronization: true
          collecting: true
          distributing: true
      - name: mlag2 client2 members ether4
        device: dc1-core-mlag2
        check: bond_members
        params:
          bond: client2
        expected:
          - ether4
      - name: mlag2 client2 member ether4 in use
        device: dc1-core-mlag2
        check: lacp_member
        params:
          bond: client2
          member: ether4
        expected:
          synchronization: true
          collecting: true
          distributing: true
  - statement: Both MLAG peers run with spanning tree off and forward both client bonds on the bridge.
    source: src/mlag_lab/intent/state/direct-none.yaml
    checks:
      - name: mlag1 protocol-mode none
        device: dc1-core-mlag1
        check: stp_mode
        params:
          bridge: bridge
        expected: none
      - name: mlag1 bridge port client1 forwarding
        device: dc1-core-mlag1
        check: bridge_port
        params:
          bridge: bridge
          port: client1
        expected:
          forwarding: true
      - name: mlag1 bridge port client2 forwarding
        device: dc1-core-mlag1
        check: bridge_port
        params:
          bridge: bridge
          port: client2
        expected:
          forwarding: true
      - name: mlag2 protocol-mode none
        device: dc1-core-mlag2
        check: stp_mode
        params:
          bridge: bridge
        expected: none
      - name: mlag2 bridge port client1 forwarding
        device: dc1-core-mlag2
        check: bridge_port
        params:
          bridge: bridge
          port: client1
        expected:
          forwarding: true
      - name: mlag2 bridge port client2 forwarding
        device: dc1-core-mlag2
        check: bridge_port
        params:
          bridge: bridge
          port: client2
        expected:
          forwarding: true
  - statement: Each client bonds both members, and both members have carrier and are in the active aggregator.
    source: src/mlag_lab/intent/state/hosts.yaml
    checks:
      - name: host1 bond0 members eth1, eth2
        device: dc1-traffic-host1
        check: bond_members
        params:
          bond: bond0
        expected:
          - eth1
          - eth2
      - name: host1 bond0 member eth1 up and eligible
        device: dc1-traffic-host1
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected:
          carrier: true
          eligible: true
      - name: host1 bond0 member eth2 up and eligible
        device: dc1-traffic-host1
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected:
          carrier: true
          eligible: true
      - name: host2 bond0 members eth1, eth2
        device: dc1-traffic-host2
        check: bond_members
        params:
          bond: bond0
        expected:
          - eth1
          - eth2
      - name: host2 bond0 member eth1 up and eligible
        device: dc1-traffic-host2
        check: bond_member
        params:
          bond: bond0
          member: eth1
        expected:
          carrier: true
          eligible: true
      - name: host2 bond0 member eth2 up and eligible
        device: dc1-traffic-host2
        check: bond_member
        params:
          bond: bond0
          member: eth2
        expected:
          carrier: true
          eligible: true
# The stream table of the suite's link-fault runner, src/mlag_lab/legacy.py FLOWS.
# Every stream sends one ping every 100 ms.
streams:
  # Client 1 to the MAC-move host.
  - id: 101
    from: dc1-traffic-host1:bond0
    to: dc1-mac-move-host:bond0
    address: 10.110.0.50
  # Client 2 to the MAC-move host.
  - id: 102
    from: dc1-traffic-host2:bond0
    to: dc1-mac-move-host:bond0
    address: 10.110.0.50
  # The MAC-move host to client 1.
  - id: 201
    from: dc1-mac-move-host:bond0
    to: dc1-traffic-host1:bond0
    address: 10.110.0.11
  # The MAC-move host to client 2.
  - id: 202
    from: dc1-mac-move-host:bond0
    to: dc1-traffic-host2:bond0
    address: 10.110.0.12
  # Client 1 to client 2 on VLAN 110.
  - id: 302
    from: dc1-traffic-host1:bond0
    to: dc1-traffic-host2:bond0
    address: 10.110.0.12
# The capture points of the suite's link-fault runner besides the stream endpoints.
# The CHR points are the QEMU tap interfaces inside the CHR container.
captures:
  - dc1-traffic-host1:eth1
  - dc1-traffic-host1:eth2
  - dc1-core-mlag1:eth2
  - dc1-core-mlag1:tap1
  - dc1-core-mlag2:tap1
  - dc1-core-mlag1:tap2
  - dc1-core-mlag2:tap2
  - dc1-core-mlag1:tap4
  - dc1-core-mlag2:tap4

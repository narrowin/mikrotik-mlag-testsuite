streams:
  - name: client1-to-client2
    from: client1:bond0
    to: client2:bond0
  - name: client2-to-client1
    from: client2:bond0
    to: client1:bond0
  - name: bypass-client1-to-client2
    from: client1:eth3
    to: client2:eth3
  - name: bypass-client2-to-client1
    from: client2:eth3
    to: client1:eth3
state:
  - statement: The primary and secondary peers are connected and run with spanning tree off.
    checks:
      - device: switch1
        check: mlag
        params: &bridge
          bridge: bridge
        expected:
          connected: true
          role: primary
      - device: switch2
        check: mlag
        params: *bridge
        expected:
          connected: true
          role: secondary
      - device: switch1
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch2
        check: stp_mode
        params: *bridge
        expected: none
      - device: switch1
        check: property
        params: &fallback
          menu: /interface/bridge
          where:
            name: bridge
          name: mlag-lacp-fallback
        expected: true
      - device: switch2
        check: property
        params: *fallback
        expected: true
  - statement: Both cables of client1 and client2 are eligible in their LACP bonds.
    checks:
      - device: client1
        check: bond_member
        params: &first-member
          bond: bond0
          member: eth1
        expected: &eligible
          carrier: true
          eligible: true
      - device: client1
        check: bond_member
        params: &second-member
          bond: bond0
          member: eth2
        expected: *eligible
      - device: client2
        check: bond_member
        params: *first-member
        expected: *eligible
      - device: client2
        check: bond_member
        params: *second-member
        expected: *eligible
switch_log: syslog/switches.log

[project]
name = "mlag-lab"
version = "0.1.0"
description = "MikroTik MLAG validation lab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["typer>=0.16,<1", "networka==0.4.1", "pydantic>=2,<3", "pyyaml>=6,<7"]

[tool.uv.sources]
networka = { url = "https://github.com/narrowin/networka/releases/download/v0.4.1/networka-0.4.1-py3-none-any.whl" }

[project.scripts]
mlag-lab = "mlag_lab.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

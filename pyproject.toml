[project]
name = "mlag-lab"
version = "0.1.0"
description = "MikroTik MLAG validation lab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1", "networka==0.3.0"]

[project.scripts]
mlag-lab = "mlag_lab.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

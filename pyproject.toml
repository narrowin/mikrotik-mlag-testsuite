[project]
name = "mlag-lab"
version = "0.1.0"
description = "MikroTik MLAG validation lab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = ["typer>=0.16,<1", "networka @ git+https://github.com/narrowin/networka@f80876d1ebdfcc076b7c3d9e5d4138455149726a", "pydantic>=2,<3", "pyyaml>=6,<7"]

[project.scripts]
mlag-lab = "mlag_lab.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

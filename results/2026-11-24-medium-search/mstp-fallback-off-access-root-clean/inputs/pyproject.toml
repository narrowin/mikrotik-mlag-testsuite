[project]
name = "mlag-lab"
version = "0.1.0"
description = "MikroTik MLAG validation lab"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["typer>=0.16,<1"]

[project.scripts]
mlag-lab = "mlag_lab.cli:main"

[project.optional-dependencies]
checkpoints = [
    "networka",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.sources]
networka = { url = "https://github.com/narrowin/networka/releases/download/v0.2.0/networka-0.2.0-py3-none-any.whl" }

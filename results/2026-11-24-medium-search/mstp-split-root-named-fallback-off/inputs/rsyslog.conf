module(load="imudp")

template(name="MlagRouterLog" type="list" option.jsonf="on") {
    property(name="timegenerated" dateFormat="rfc3339" date.inUTC="on" outname="received_at" format="jsonf")
    property(name="fromhost-ip" outname="source_ip" format="jsonf")
    property(name="rawmsg" outname="raw" format="jsonf")
}

ruleset(name="MlagRouterLogs") {
    if (is_in_subnet($fromhost-ip, "172.30.215.0/27") or
        is_in_subnet($fromhost-ip, "172.30.216.0/27") or
        is_in_subnet($fromhost-ip, "172.30.217.0/27") or
        is_in_subnet($fromhost-ip, "172.30.218.0/27")) then {
        action(type="omfile" file="/evidence/routeros.jsonl" template="MlagRouterLog" fileCreateMode="0640")
    }
}

input(type="imudp" port="1514" ruleset="MlagRouterLogs")

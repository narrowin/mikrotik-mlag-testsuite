 Z" fill="#0ca30c"/><path d="M360,492.0 H433.03740400000004 a4,4 0 0 1 4,4 V506.0 a4,4 0 0 1 -4,4 H360 Z" fill="#0ca30c"/><line x1="483.33333333333337" y1="130" x2="483.33333333333337" y2="376" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="483.33333333333337" y1="412" x2="483.33333333333337" y2="522" stroke="#0b0b0b" stroke-width="1.5" stroke-dasharray="4 3"/><text x="24" y="34" font-size="18" font-weight="700" fill="#0b0b0b">How long traffic stops when one MLAG switch reboots</text><text x="24" y="58" font-size="13" fill="#52514e">Each bar is the longest stop in any valid run, counting both the primary and the secondary reboot.</text><text x="24" y="76" font-size="13" fill="#52514e">The dashed line marks the 5 s limit.</text><text x="489.33333333333337" y="98" font-size="12" fill="#0b0b0b">limit 5 s</text><text x="24" y="122" font-size="14" font-weight="600" fill="#0b0b0b">Medium lab</text><text x="348" y="155.5" font-size="13" fill="#52514e" text-anchor="end">STP off</text><text x="896" y="155.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 2.73 s</text><text x="348" y="189.5" font-size="13" fill="#52514e" text-anchor="end">STP off on the pair, RSTP on the access switch</text><text x="896" y="189.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 2.93 s</text><text x="348" y="223.5" font-size="13" fill="#52514e" text-anchor="end">MSTP, access switch is root of VLAN 110 only</text><text x="896" y="223.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 3.23 s</text><text x="348" y="253.0" font-size="13" fill="#52514e" text-anchor="end">MSTP, access switch is root of the default instance</text><text x="348" y="266.0" font-size="11" fill="#898781" text-anchor="end">VLAN never forwarded in 4 of 6 suites</text><text x="896" y="257.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 11.55 s</text><text x="348" y="291.5" font-size="13" fill="#52514e" text-anchor="end">RSTP, MLAG pair is root</text><text x="896" y="291.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 11.65 s</text><text x="348" y="325.5" font-size="13" fill="#52514e" text-anchor="end">MSTP, MLAG pair is root</text><text x="896" y="325.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 13.08 s</text><text x="348" y="359.5" font-size="13" fill="#52514e" text-anchor="end">RSTP, access switch is root</text><text x="896" y="359.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">✗ VLAN never forwarded</text><text x="24" y="404" font-size="14" font-weight="600" fill="#0b0b0b">Small lab</text><text x="348" y="437.5" font-size="13" fill="#52514e" text-anchor="end">MSTP, MLAG pair is root</text><text x="896" y="437.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 2.20 s</text><text x="348" y="471.5" font-size="13" fill="#52514e" text-anchor="end">STP off</text><text x="896" y="471.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 2.93 s</text><text x="348" y="505.5" font-size="13" fill="#52514e" text-anchor="end">RSTP, MLAG pair is root</text><text x="896" y="505.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✓ 3.12 s</text><text x="896" y="98" font-size="12" fill="#898781" text-anchor="end">Longest stop</text></svg>

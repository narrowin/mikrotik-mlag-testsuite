" text-anchor="end">MSTP, access switch is root of the default instance</text><text x="348" y="232.0" font-size="11" fill="#898781" text-anchor="end">VLAN never forwarded in 4 of 6 suites</text><text x="896" y="223.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 11.55 s</text><text x="348" y="257.5" font-size="13" fill="#52514e" text-anchor="end">MSTP, MLAG pair is root</text><text x="896" y="257.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 13.08 s</text><text x="348" y="291.5" font-size="13" fill="#52514e" text-anchor="end">RSTP, MLAG pair is root</text><text x="896" y="291.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 17.59 s</text><text x="348" y="325.5" font-size="13" fill="#52514e" text-anchor="end">STP off</text><text x="896" y="325.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 23.34 s</text><text x="348" y="359.5" font-size="13" fill="#52514e" text-anchor="end">RSTP, access switch is root</text><text x="896" y="359.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">✗ VLAN never forwarded</text><text x="348" y="389.0" font-size="13" fill="#52514e" text-anchor="end">MSTP, access switch is root of the default instance, baseline 60 s after the bridge change</text><text x="348" y="402.0" font-size="11" fill="#898781" text-anchor="end">VLAN never forwarded in 1 of 2 suites</text><text x="896" y="393.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">✗ VLAN never forwarded</text><text x="348" y="423.0" font-size="13" fill="#52514e" text-anchor="end">RSTP, access switch is root, baseline 60 s after the bridge change</text><text x="348" y="436.0" font-size="11" fill="#898781" text-anchor="end">VLAN never forwarded in 1 of 2 suites</text><text x="896" y="427.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end">✗ VLAN never forwarded</text><text x="24" y="472" font-size="14" font-weight="600" fill="#0b0b0b">Small lab</text><text x="348" y="501.0" font-size="13" fill="#52514e" text-anchor="end">MSTP, MLAG pair is root</text><text x="348" y="514.0" font-size="11" fill="#898781" text-anchor="end">not tested for looped-back frames</text><text x="896" y="505.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">? 3.14 s</text><text x="348" y="535.0" font-size="13" fill="#52514e" text-anchor="end">STP off</text><text x="348" y="548.0" font-size="11" fill="#898781" text-anchor="end">loss in limit; looped back on CHR, hardware untested</text><text x="896" y="539.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">✗ 2.93 s</text><text x="348" y="569.0" font-size="13" fill="#52514e" text-anchor="end">RSTP, MLAG pair is root</text><text x="348" y="582.0" font-size="11" fill="#898781" text-anchor="end">not tested for looped-back frames</text><text x="896" y="573.5" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="end" style="font-variant-numeric: tabular-nums">? 3.12 s</text><text x="896" y="98" font-size="12" fill="#898781" text-anchor="end">Longest stop</text></svg>
